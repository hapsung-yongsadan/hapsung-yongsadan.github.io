<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>합성용사단 관리자</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#160e08;--card:#2a1c10;--line:rgba(242,200,106,.22);--gold:#ffd978;--txt:#f3e7cf;--sub:#bba887;--ok:#9dff9a;--warn:#ffb36a;--off:#8a7a62}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',sans-serif;padding:16px;max-width:900px;margin:0 auto}
  h1{font-family:Jua;font-weight:400;color:var(--gold);font-size:26px;margin:4px 0 2px}
  .sub{color:var(--sub);font-size:13px;margin-bottom:14px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
  .kpi b{display:block;font-family:Jua;font-weight:400;font-size:26px;color:var(--gold)}
  .kpi span{font-size:12px;color:var(--sub)}
  .bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .bar button{font-family:Jua;font-size:14px;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 12px}
  .bar button.on{background:#7a5420;border-color:var(--gold);color:#fff}
  .bar .r{margin-left:auto;color:var(--sub);font-size:12px}
  .p{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
  .p .n{font-family:Jua;font-size:18px}
  .p .n i{font-style:normal;font-size:12px;margin-left:6px;padding:1px 7px;border-radius:9px;vertical-align:2px}
  .p .t{text-align:right;font-size:13px;color:var(--sub)}
  .p .d{grid-column:1/-1;font-size:13px;color:#e8d8b0;display:flex;flex-wrap:wrap;gap:4px 14px}
  .p .d b{color:var(--gold);font-weight:700}
  .on-now{background:rgba(157,255,154,.18);color:var(--ok)}
  .today{background:rgba(255,217,120,.15);color:var(--gold)}
  .away{background:rgba(255,179,106,.15);color:var(--warn)}
  .gone{background:rgba(138,122,98,.2);color:var(--off)}
  .msg{color:var(--sub);text-align:center;padding:30px 0}
  @media (max-width:520px){ .kpis{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<h1>합성용사단 관리자</h1>
<div class="sub">게임을 연 사람들의 접속 기록 · 닉네임과 게임 기록만 모아요 · 1분마다 자동 새로고침</div>
<div class="kpis">
  <div class="kpi"><b id="kAll">-</b><span>전체 플레이어</span></div>
  <div class="kpi"><b id="kNow">-</b><span>지금 접속 (5분)</span></div>
  <div class="kpi"><b id="kToday">-</b><span>오늘 접속</span></div>
  <div class="kpi"><b id="kWeek">-</b><span>최근 7일</span></div>
</div>
<div class="bar">
  <button data-s="last" class="on">최근 접속순</button><button data-s="best">스테이지순</button><button data-s="play">플레이 시간순</button>
  <span class="r" id="upd"></span>
</div>
<div id="list"><div class="msg">불러오는 중…</div></div>
<script>
const K='AIzaSyC9aaKvIXlr8V3rIHVryyVWs0jOFaa48q4', D='https://firestore.googleapis.com/v1/projects/brogame-24c11/databases/(default)/documents';
const AREA = ['초록 들판','이끼 숲','안개 늪','바람 언덕','붉은 화산','황금 사막','얼음 성채','심해 신전','천공의 섬','마왕성'];
const area = st => { const a = Math.min(9, Math.floor((st-1)/5)); return AREA[a] + ' ' + (st - a*5); };
const fmt = v => v >= 1e12 ? (v/1e12).toFixed(1)+'조' : v >= 1e8 ? (v/1e8).toFixed(1)+'억' : v >= 1e4 ? Math.round(v/1e4)+'만' : Math.round(v).toLocaleString();
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = ms => { const m = Math.floor((Date.now()-ms)/60000); if (m < 1) return '방금'; if (m < 60) return m+'분 전'; const h = Math.floor(m/60); if (h < 24) return h+'시간 전'; return Math.floor(h/24)+'일 전'; };
const dur = s => { const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h ? h+'시간 '+m+'분' : m+'분'; };
const kday = ms => Math.floor((ms + 9*3600e3)/86400e3);
const week = () => Math.floor((kday(Date.now()) + 3)/7);
let token = null, rows = [], sortBy = 'last';
async function tok(){ if (token) return token;
  const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+K,{method:'POST',headers:{'Content-Type':'application/json'},body:'{"returnSecureToken":true}'});
  token = (await r.json()).idToken; setTimeout(() => token = null, 50*60e3); return token; }
async function load(){
  try {
    const t = await tok(), out = []; let page = '';
    do { const r = await fetch(D+'/h2d_stats?pageSize=300&key='+K+(page?'&pageToken='+page:''),{headers:{'Authorization':'Bearer '+t}});
      const j = await r.json(); if (!r.ok) throw new Error(r.status + ' ' + (j.error?.message||''));
      (j.documents||[]).forEach(d => { const f = d.fields || {}, n = k => +(f[k]?.integerValue ?? f[k]?.doubleValue ?? 0);
        out.push({ nick: f.nick?.stringValue || '(닉네임 정하기 전)', stage:n('stage'), best:n('best'), power:n('power'), play:n('playSec'), first:n('first'), last:n('last'), visits:n('visits'), raidWk:n('raidWk'), raidDmg:n('raidDmg'), heroes:n('heroes') }); });
      page = j.nextPageToken || ''; } while (page);
    rows = out; render(); document.getElementById('upd').textContent = new Date().toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul'}) + ' 기준';
  } catch(e){ document.getElementById('list').innerHTML = '<div class="msg">서버에 연결하지 못했어요<br><small>' + esc(e.message) + '</small></div>'; }
}
function render(){
  const now = Date.now(), today = kday(now);
  document.getElementById('kAll').textContent = rows.length;
  document.getElementById('kNow').textContent = rows.filter(o => now - o.last < 5*60e3).length;
  document.getElementById('kToday').textContent = rows.filter(o => kday(o.last) === today).length;
  document.getElementById('kWeek').textContent = rows.filter(o => now - o.last < 7*86400e3).length;
  const list = rows.slice().sort((a,b) => sortBy === 'best' ? b.best - a.best : sortBy === 'play' ? b.play - a.play : b.last - a.last);
  document.getElementById('list').innerHTML = list.length ? list.map(o => {
    const d = now - o.last, st = d < 5*60e3 ? ['on-now','접속 중'] : kday(o.last) === today ? ['today','오늘'] : d < 3*86400e3 ? ['away','최근'] : ['gone', Math.floor(d/86400e3) + '일째 안 옴'];
    return '<div class="p"><div class="n">' + esc(o.nick) + '<i class="' + st[0] + '">' + st[1] + '</i></div><div class="t">' + ago(o.last) + '</div>' +
      '<div class="d"><span>현재 <b>' + area(Math.max(1,o.stage)) + '</b></span><span>최고 ' + area(Math.max(1,o.best)) + '</span><span>전투력 ' + fmt(o.power) + '</span>' +
      '<span>플레이 ' + dur(o.play) + '</span><span>접속 ' + o.visits + '번</span><span>영웅 ' + o.heroes + '명</span>' +
      '<span>레이드 ' + (o.raidWk === week() && o.raidDmg > 0 ? fmt(o.raidDmg) : '이번 주 안 함') + '</span>' +
      '<span>처음 ' + (o.first ? new Date(o.first).toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul'}) : '-') + '</span></div></div>'; }).join('')
    : '<div class="msg">아직 접속 기록이 없어요.<br>지인들이 게임을 열면 여기에 나타나요.</div>';
}
document.querySelectorAll('.bar button').forEach(b => b.onclick = () => { sortBy = b.dataset.s; document.querySelectorAll('.bar button').forEach(x => x.classList.toggle('on', x === b)); render(); });
load(); setInterval(load, 60000);
</script>
</body>
</html>
