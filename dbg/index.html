<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#14131c">
  <title>합성용사단</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #14131c; overflow: hidden; touch-action: none; }
    #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    /* 세로 게임: 화면에 맞는 가장 큰 9:19.5 비율 */
    #unity-canvas { background: #14131c; display: block; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #efe9dc; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; gap: 16px; }
    #loading h1 { color: #f4c35a; font-size: 30px; margin: 0; }
    #bar { width: 220px; height: 10px; border-radius: 5px; background: #282637; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #f4c35a; transition: width .2s; }
    #msg { font-size: 14px; color: #9c96b0; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loading"><h1>합성용사단</h1><div id="bar"><div id="fill"></div></div><div id="pct" style="font-size:22px;font-weight:700;color:#f4c35a">0%</div><div id="msg">게임 받는 중… (처음 한 번만 오래 걸리고, 다음부터는 빨라요)</div></div>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    function fit() {
      const w = window.innerWidth, h = window.innerHeight, ratio = 9 / 19.5;
      let cw = w, ch = h;
      if (w / h > ratio) cw = Math.floor(h * ratio); else ch = Math.floor(w / ratio);
      // 휴대폰처럼 세로로 긴 화면이면 꽉 채움
      if (w / h < 0.62) { cw = w; ch = h; }
      canvas.style.width = cw + "px";
      canvas.style.height = ch + "px";
    }
    window.addEventListener("resize", fit);
    fit();
    const buildUrl = "Build";
    const config = {
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Cafe686",
      productName: "합성용사단",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };
    const script = document.createElement("script");
    script.src = buildUrl + "/WebGL.loader.js";
    script.onload = () => {
      createUnityInstance(canvas, config, p => {
        document.querySelector("#fill").style.width = (p * 100) + "%";
        document.querySelector("#pct").textContent = Math.floor(p * 100) + "%";
        if (p >= 0.9) document.querySelector("#msg").textContent = "거의 다 됐어요! 게임 준비 중…";
      })
        .then(() => { document.querySelector("#loading").style.display = "none"; })
        .catch(e => { document.querySelector("#msg").textContent = "불러오지 못했어요: " + e; });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
