<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07050c">
<title>루미에르 온라인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Myeongjo:wght@800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;background:#050308;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:'Jua',system-ui,sans-serif;color:#efe6d6}
  #wrap{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;container-type:size}
  #stage{position:relative;aspect-ratio:9/16;width:min(100cqw, calc(100cqh * 9 / 16));height:auto;overflow:hidden;background:#07050c;container-type:size}
  canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
  button{font-family:inherit;cursor:pointer;border:0;color:inherit}
  input{font-family:inherit;-webkit-user-select:text;user-select:text;font-size:16px}
  .hide{display:none!important}
  .serif{font-family:'Nanum Myeongjo',serif;font-weight:800}

  /* 색: 희귀도 */
  .r0{color:#e8e2d6} .r1{color:#6f9bff} .r2{color:#ffe14a} .r3{color:#ff8a1e} .r4{color:#ff3a5a}
  .b0{border-color:#6a6258!important} .b1{border-color:#3e66d8!important} .b2{border-color:#d8b41a!important} .b3{border-color:#ff7a10!important;box-shadow:0 0 8px rgba(255,120,20,.55)} .b4{border-color:#ff2a4a!important;box-shadow:0 0 10px rgba(255,40,80,.7)}
  .g0{background:radial-gradient(#2a2622,#141210)} .g1{background:radial-gradient(#1c2a5a,#0c1022)} .g2{background:radial-gradient(#4a3e10,#1a1606)} .g3{background:radial-gradient(#6a2e06,#200c02)} .g4{background:radial-gradient(#6a0a1e,#22040a)}

  /* ---- 위쪽 HUD ---- */
  #top{position:absolute;left:2.4cqw;top:2.4cqw;display:flex;gap:2cqw;align-items:center;z-index:5;pointer-events:none;width:68cqw}
  #face{width:14cqw;height:14cqw;border-radius:8px;border:2px solid #8a6a3a;background:#120c16;flex:none;position:relative;box-shadow:0 0 0 2px #000,0 0 12px rgba(255,170,60,.25);overflow:hidden}
  #face canvas{width:100%;height:100%;image-rendering:pixelated}
  #lvB{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:2.6cqw;background:rgba(0,0,0,.75);color:#ffd88a}
  #who{flex:1;min-width:0}
  #nm{font-size:3.8cqw;color:#f3e6c8;text-shadow:0 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #nm small{font-size:2.6cqw;color:#bfae8e;margin-left:1cqw}
  #xpB{position:relative;height:2.2cqw;border-radius:2px;background:#000;border:1px solid #5a4a2a;margin-top:1cqw;overflow:hidden}
  #xpB i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,#8a5a10,#ffc04a)}
  #xpB b{position:absolute;inset:0;font-weight:400;font-size:1.9cqw;line-height:2cqw;text-align:center;text-shadow:0 1px 0 #000}
  #goldB{font-size:3cqw;color:#ffd060;margin-top:.8cqw;text-shadow:0 2px 0 #000}
  #goldB span{color:#c8b8ff;margin-left:2cqw}
  #qTrack{position:absolute;left:2.4cqw;top:21cqw;max-width:66cqw;z-index:6;text-align:left;font-size:2.9cqw;line-height:1.35;padding:1.4cqw 2.4cqw;border-radius:4px;background:rgba(10,6,4,.72);border:1.5px solid #6a5232;box-shadow:0 0 0 1px #000;color:#e8d8b8;display:none}
  #qTrack.on{display:block}
  #qTrack b{font-weight:400;color:#ffd88a}
  #qTrack i{font-style:normal;color:#9aff7a;margin-left:1.4cqw}
  #qTrack.done{border-color:#7aff7a;animation:qpulse 1s ease-in-out infinite alternate}
  @keyframes qpulse{to{box-shadow:0 0 0 1px #000,0 0 12px rgba(120,255,120,.6)}}
  #mini{position:absolute;right:2.4cqw;top:2.4cqw;width:25cqw;height:25cqw;border:2px solid #6a5232;border-radius:6px;background:#000c;z-index:5;pointer-events:none;box-shadow:0 0 0 2px #000}
  #mapN{position:absolute;right:2.4cqw;top:28cqw;width:25cqw;text-align:center;font-size:2.7cqw;color:#e8d2a8;z-index:5;pointer-events:none;text-shadow:0 1px 0 #000}
  #side{position:absolute;right:2.4cqw;top:33cqw;display:flex;flex-direction:column;gap:1.6cqw;z-index:6}
  .sb{width:12cqw;height:12cqw;border-radius:8px;background:linear-gradient(180deg,#2a2018,#120c08);border:2px solid #6a5232;box-shadow:0 0 0 1.5px #000,inset 0 0 8px rgba(0,0,0,.8);font-size:5.4cqw;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .sb small{font-size:2.2cqw;color:#cbb892;margin-top:.5cqw}
  .sb i{position:absolute;top:-1.2cqw;right:-1.2cqw;min-width:4.2cqw;height:4.2cqw;border-radius:99px;background:#d8202a;border:1.5px solid #ffd0a0;font-style:normal;font-size:2.4cqw;line-height:3.8cqw;padding:0 .8cqw;display:none;color:#fff}
  .sb i.on{display:block}

  /* ---- 아래 HUD ---- */
  .orb{position:absolute;bottom:2.4cqw;width:21cqw;height:21cqw;border-radius:50%;z-index:6;overflow:hidden;border:3px solid #6a5232;box-shadow:0 0 0 2px #000,0 0 18px rgba(0,0,0,.9),inset 0 0 14px rgba(0,0,0,.9);background:#0a0606;pointer-events:none}
  .orb i{position:absolute;left:0;right:0;bottom:0;height:50%;transition:height .15s}
  .orb b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:400;font-size:2.8cqw;text-shadow:0 1px 2px #000,0 0 4px #000;flex-direction:column;line-height:1.1}
  .orb::after{content:'';position:absolute;left:14%;top:8%;width:45%;height:30%;border-radius:50%;background:radial-gradient(ellipse at 40% 40%,rgba(255,255,255,.5),rgba(255,255,255,0) 70%)}
  #hpO{left:2.4cqw} #hpO i{background:radial-gradient(ellipse at 50% 20%,#ff5a4a,#a00a10 55%,#4a0004)}
  #mpO{left:25cqw;width:16cqw;height:16cqw} #mpO i{background:radial-gradient(ellipse at 50% 20%,#5a8aff,#1a2ab0 55%,#04084a)}
  #pots{position:absolute;left:2.4cqw;bottom:26cqw;display:flex;gap:1.6cqw;z-index:6}
  .pb{width:11.5cqw;height:11.5cqw;border-radius:8px;background:linear-gradient(180deg,#2a2018,#120c08);border:2px solid #6a5232;box-shadow:0 0 0 1.5px #000;position:relative;display:flex;align-items:center;justify-content:center}
  .pb canvas{width:80%;height:80%;image-rendering:pixelated}
  .pb b{position:absolute;right:.4cqw;bottom:0;font-weight:400;font-size:2.5cqw;text-shadow:0 1px 0 #000,0 0 3px #000}
  #autoB{position:absolute;left:2.4cqw;bottom:39.5cqw;z-index:6;font-size:3cqw;padding:1.6cqw 3cqw;border-radius:6px;background:linear-gradient(180deg,#2a2018,#120c08);border:2px solid #6a5232;box-shadow:0 0 0 1.5px #000}
  #autoB.on{background:linear-gradient(180deg,#c8701a,#5a2a04);border-color:#ffc060;color:#fff;box-shadow:0 0 0 1.5px #000,0 0 14px rgba(255,140,30,.7)}
  #acts{position:absolute;right:2.4cqw;bottom:2.4cqw;width:46cqw;height:46cqw;z-index:6;pointer-events:none}
  #acts button{position:absolute;pointer-events:auto;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #bAtk{right:0;bottom:0;width:21cqw;height:21cqw;background:radial-gradient(circle at 40% 35%,#6a2a1a,#1e0806);border:3px solid #a87a3a;box-shadow:0 0 0 2px #000,0 0 14px rgba(255,90,30,.35)}
  #bAtk canvas{width:62%;height:62%;image-rendering:pixelated}
  .sk{width:14cqw;height:14cqw;background:radial-gradient(circle at 40% 35%,#2e2240,#0c0814);border:2.5px solid #8a7ab0;box-shadow:0 0 0 2px #000;font-size:5.6cqw;overflow:hidden}
  .sk small{font-size:2cqw;color:#d8ccf0;margin-top:-.2cqw}
  .sk .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.78) var(--p,0%), transparent 0);border-radius:50%;pointer-events:none}
  .sk .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:4.4cqw;text-shadow:0 2px 0 #000;pointer-events:none;font-style:normal}
  .sk.lock{filter:grayscale(1) brightness(.5)}
  #sk0{right:23cqw;bottom:0} #sk1{right:21cqw;bottom:16cqw} #sk2{right:5cqw;bottom:23cqw}
  #talkB{position:absolute;left:50%;bottom:26cqw;transform:translateX(-50%);z-index:7;font-size:3.6cqw;padding:2cqw 4.4cqw;border-radius:6px;background:linear-gradient(180deg,#5a3a14,#2a1604);color:#ffe0a0;border:2px solid #c8963a;box-shadow:0 0 0 2px #000,0 0 14px rgba(255,170,60,.4);display:none;white-space:nowrap}
  #talkB.on{display:block}
  #petHud{position:absolute;left:43cqw;bottom:2.4cqw;width:14cqw;z-index:6;pointer-events:none;text-align:center;display:none}
  #petHud.on{display:block}
  #petHud .bar{height:1.6cqw;background:#000;border:1px solid #5a4a2a;margin-top:.6cqw;position:relative;overflow:hidden}
  #petHud .bar i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,#3a8a3a,#9aff7a)}
  #petHud small{font-size:2.3cqw;color:#cbe8b8;text-shadow:0 1px 0 #000}

  /* ---- 알림 ---- */
  #toast{position:absolute;left:50%;top:36cqw;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:1cqw;pointer-events:none;width:92%}
  #toast div{background:rgba(6,4,10,.88);border:1px solid #5a4a2a;border-radius:4px;padding:1.3cqw 3.4cqw;font-size:3.1cqw;text-align:center;animation:tin .2s ease-out}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}}
  #banner{position:absolute;left:0;right:0;top:38%;text-align:center;z-index:21;pointer-events:none;opacity:0;transition:opacity .35s}
  #banner.on{opacity:1}
  #banner b{display:block;font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:8cqw;color:#ffd88a;text-shadow:0 0 18px rgba(255,150,40,.8),0 3px 0 #000}
  #banner small{display:block;font-size:3.6cqw;color:#efe6d6;text-shadow:0 2px 0 #000;margin-top:1.4cqw}
  #flash{position:absolute;inset:0;z-index:19;pointer-events:none;opacity:0;transition:opacity .4s}

  /* ---- 창 ---- */
  .modal{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.66);display:none;align-items:center;justify-content:center;padding:3cqw}
  .modal.on{display:flex}
  .box{width:100%;max-height:90cqh;display:flex;flex-direction:column;background:linear-gradient(180deg,#1e1712,#0e0a08);border:2px solid #8a6a3a;border-radius:6px;padding:3.2cqw;box-shadow:0 0 0 2px #000,0 10px 40px #000,inset 0 0 30px rgba(0,0,0,.6)}
  .mh{display:flex;justify-content:space-between;align-items:center;font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:5cqw;color:#ffd88a;margin-bottom:2.4cqw;border-bottom:1px solid #4a3a22;padding-bottom:2cqw}
  .mh button{width:8cqw;height:8cqw;border-radius:4px;background:#2a1e14;border:1.5px solid #6a5232;font-size:4cqw;font-family:'Jua'}
  .scr{overflow-y:auto;touch-action:pan-y;flex:1;min-height:0}
  .row{display:flex;align-items:center;gap:2.4cqw;padding:2cqw;border-radius:4px;background:rgba(0,0,0,.35);border:1px solid #3a2e1e;margin-bottom:1.4cqw}
  .row .ic{width:11cqw;height:11cqw;flex:none;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:6cqw;background:#0c0806;border:1.5px solid #3a2e1e}
  .row .ic canvas{width:90%;height:90%;image-rendering:pixelated}
  .row .tx{flex:1;min-width:0;font-size:3.4cqw}
  .row .tx small{display:block;font-size:2.6cqw;color:#bba888;margin-top:.4cqw;line-height:1.4}
  .btn{font-size:3.2cqw;padding:1.8cqw 3cqw;border-radius:4px;background:linear-gradient(180deg,#4a3422,#22160c);border:1.5px solid #a07a44;color:#ffe6b8;white-space:nowrap;box-shadow:0 0 0 1px #000}
  .btn.gold{background:linear-gradient(180deg,#a8721a,#5a3404);border-color:#ffcc6a;color:#fff}
  .btn.red{background:linear-gradient(180deg,#8a1a1a,#3a0606);border-color:#ff8a6a;color:#fff}
  .btn.blue{background:linear-gradient(180deg,#2a3a8a,#0c143a);border-color:#8aaaff;color:#fff}
  .btn:disabled{filter:grayscale(1);opacity:.45}
  .big{display:block;width:100%;font-size:4.4cqw;padding:3cqw;margin-top:2cqw}
  .tabs{display:flex;gap:1.2cqw;margin-bottom:2cqw}
  .tabs button{flex:1;font-size:3.2cqw;padding:1.6cqw 0;border-radius:4px;background:#1a120c;border:1.5px solid #4a3a22;color:#bba888}
  .tabs button.on{background:linear-gradient(180deg,#6a4a1e,#2e1e0a);color:#ffe0a0;border-color:#c8963a}
  .doll{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6cqw;margin-bottom:2cqw}
  .es{aspect-ratio:1;border-radius:4px;border:2px solid #3a2e1e;display:flex;align-items:center;justify-content:center;position:relative;background:#0c0806}
  .es canvas{width:84%;height:84%;image-rendering:pixelated}
  .es small{position:absolute;left:0;right:0;bottom:.2cqw;text-align:center;font-size:2.1cqw;color:#8a7a5a;text-shadow:0 1px 0 #000}
  .es.empty canvas{opacity:.18}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:1.2cqw}
  .slot{aspect-ratio:1;border-radius:3px;border:1.5px solid #2e241a;display:flex;align-items:center;justify-content:center;position:relative;background:#0a0806}
  .slot canvas{width:86%;height:86%;image-rendering:pixelated}
  .slot .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:5cqw;color:#fff;text-shadow:0 0 6px #000,0 0 10px currentColor;font-family:'Nanum Myeongjo',serif;font-weight:800}
  .slot .lv{position:absolute;right:.6cqw;bottom:0;font-size:2cqw;text-shadow:0 1px 0 #000}
  .slot.sel{outline:2px solid #fff;outline-offset:-1px}
  .slot.eqd::after{content:'E';position:absolute;left:.6cqw;top:0;font-size:2.2cqw;color:#9aff7a}
  /* 아이템 설명 (디아블로식) */
  .tip{border:2px solid #4a3a22;background:linear-gradient(180deg,rgba(14,10,8,.97),rgba(6,4,4,.97));padding:2.6cqw;border-radius:4px;margin-top:2cqw;text-align:center;box-shadow:inset 0 0 20px #000}
  .tip .tn{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:4.6cqw;line-height:1.25}
  .tip .tt{font-size:2.8cqw;color:#9a8a6a;margin:.6cqw 0 1.4cqw}
  .tip .tb{font-size:3.6cqw;color:#fff;margin-bottom:1cqw}
  .tip .ta{font-size:3.1cqw;color:#7aa0ff;line-height:1.55}
  .tip .ta.pf{color:#a8c4ff;text-shadow:0 0 6px rgba(120,160,255,.6)}
  .tip .tl{font-size:3.1cqw;color:#ff9a3a;line-height:1.5;margin-top:1cqw;padding-top:1cqw;border-top:1px solid #3a2a18}
  .tip .tu{font-size:3.4cqw;color:#ff6a6a;margin:1cqw 0}
  .tip .tc{font-size:2.7cqw;color:#9a8a6a;margin-top:1.2cqw}
  .up{color:#7aff7a} .dn{color:#ff6a6a}
  .acts2{display:flex;gap:1.6cqw;margin-top:2cqw;flex-wrap:wrap}
  .acts2 .btn{flex:1}
  .stat{display:flex;align-items:center;gap:2cqw;padding:1.6cqw 1cqw;border-bottom:1px solid #2e241a;font-size:3.7cqw}
  .stat .sn{width:19cqw;color:#e8d2a8} .stat .sv{flex:1;color:#fff} .stat small{display:block;font-size:2.4cqw;color:#9a8a6a}
  .stat button{width:9cqw;height:9cqw;border-radius:4px;font-size:5cqw;background:linear-gradient(180deg,#3a6a2a,#122a0a);border:1.5px solid #8ad06a;color:#fff}
  .stat button:disabled{filter:grayscale(1);opacity:.3}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:1cqw 3cqw;font-size:2.9cqw;color:#bba888;margin-top:2cqw;padding:2cqw;border-radius:4px;background:rgba(0,0,0,.35);border:1px solid #2e241a}
  .kv b{float:right;font-weight:400;color:#fff}
  .talk{display:flex;gap:3cqw;align-items:flex-start;margin-bottom:2cqw}
  .talk canvas{width:20cqw;height:28cqw;flex:none;image-rendering:pixelated}
  .talk p{font-size:3.5cqw;line-height:1.6;background:rgba(0,0,0,.4);border:1px solid #3a2e1e;border-radius:4px;padding:2.6cqw;flex:1;color:#e8dcc4}
  .talk p b{font-weight:400;color:#ffd88a}
  .sec{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:3.8cqw;color:#e8c27a;margin:3cqw 0 1.4cqw}
  .note{font-size:2.8cqw;color:#9a8a6a;line-height:1.5}

  /* 감정 연출 */
  #idM .box{max-height:94cqh}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:2cqw;perspective:800px;margin:2cqw 0}
  .card{aspect-ratio:3/4;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
  .card.open{transform:rotateY(180deg)}
  .card>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px;border:2px solid #4a3a22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw}
  .card .fr{background:repeating-linear-gradient(45deg,#1a120c 0 6px,#140e08 6px 12px);font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:8cqw;color:#6a5232}
  .card .bk{transform:rotateY(180deg);background:#0a0806}
  .card .bk canvas{width:62%;image-rendering:pixelated}
  .card .bk small{font-size:2.2cqw;text-align:center;line-height:1.2;padding:0 .6cqw}
  .card.r3 .bk{animation:legGlow 1.2s ease-in-out infinite alternate}
  .card.r4 .bk{animation:mythGlow .8s ease-in-out infinite alternate}
  @keyframes legGlow{from{box-shadow:0 0 6px #ff7a10}to{box-shadow:0 0 22px #ff9a30,0 0 40px rgba(255,120,20,.5)}}
  @keyframes mythGlow{from{box-shadow:0 0 8px #ff2a4a}to{box-shadow:0 0 26px #ff4a6a,0 0 50px rgba(255,40,80,.6)}}

  /* 시작 화면 */
  #title{position:absolute;inset:0;z-index:40;background:#050308;display:flex;flex-direction:column;align-items:center;padding:11cqh 5cqw 5cqw;overflow:hidden}
  #tbg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  #logo{position:relative;text-align:center;margin-bottom:1cqh}
  #logo b{display:block;font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:13cqw;line-height:1;color:#ffe8b8;text-shadow:0 0 20px rgba(255,170,60,.9),0 0 50px rgba(255,120,30,.5),0 4px 0 #2a1404;letter-spacing:.6cqw}
  #logo small{display:block;font-size:4cqw;letter-spacing:3cqw;color:#c8a46a;margin-top:1.6cqw;text-shadow:0 0 8px rgba(255,150,40,.6)}
  #sub{position:relative;font-size:3.2cqw;color:#bba888;margin:1.6cqw 0 4cqw;text-align:center;line-height:1.5}
  .cls{display:flex;gap:2cqw;width:100%;position:relative}
  .cl{flex:1;border-radius:4px;background:linear-gradient(180deg,rgba(40,28,18,.85),rgba(10,6,4,.92));border:2px solid #4a3a22;padding:2cqw 1cqw 2.4cqw;text-align:center;transition:transform .15s;box-shadow:0 0 0 1.5px #000}

<script>
'use strict';
// =====================================================================
//  루미에르 온라인 — 다크 판타지 액션 RPG (1단계: 혼자 하는 게임)
//  · 디아블로식 무작위 옵션 장비 + 미확인 아이템 감정

//  화면: 720×1280 논리 좌표, 도트 그림은 4배(PX)로 확대해서 그림
// =====================================================================
const W = 720, H = 1280, PX = 4, TS = 16 * PX;   // 타일 한 칸 = 64
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => { n = Math.floor(n); return n >= 1e8 ? (n/1e8).toFixed(1).replace(/\.0$/,'') + '억' : n >= 1e4 ? (n/1e4).toFixed(1).replace(/\.0$/,'') + '만' : n.toLocaleString(); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
const SAVE_KEY = 'lumi_save_v2';

// =================== 그림 (도트 아틀라스) ===================
let ATL = null, IMD = null, IMI = null;
function loadAssets(){
  const img = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
  return Promise.all([fetch('assets/atlas.json').then(r => r.json()), img('assets/dungeon.png'), img('assets/items.png')]).then(([a, d, i]) => { ATL = a; IMD = d; IMI = i; });
}
const has = n => ATL && ATL.f[n];
// 프레임 이름 찾기: name_idle_anim_f0 / name_anim_f0 / name
function frameOf(base, kind, t){
  const i = Math.floor(t * 8) % 4;
  const a = base + '_' + kind + '_anim_f' + i; if (has(a)) return a;
  const b = base + '_idle_anim_f' + i; if (has(b)) return b;
  const c = base + '_anim_f' + i; if (has(c)) return c;
  return base;
}
// 발밑 기준으로 그리기
function spr(name, x, y, o){
  const f = ATL.f[name]; if (!f) return; o = o || {}; const s = o.s || PX, w = f[2] * s, h = f[3] * s;
  cx.save(); cx.translate(Math.round(x), Math.round(y)); if (o.flip) cx.scale(-1, 1); if (o.rot) cx.rotate(o.rot); if (o.a != null) cx.globalAlpha = o.a;
  const ox = o.cx != null ? o.cx : w/2, oy = o.cy != null ? o.cy : h;
  cx.drawImage(IMD, f[0], f[1], f[2], f[3], -ox, -oy, w, h);
  if (o.flash){ cx.globalCompositeOperation = 'source-atop'; cx.globalAlpha = o.flash; cx.fillStyle = o.fc || '#fff'; cx.fillRect(-ox, -oy, w, h); }
  cx.restore();
}
// 작은 캔버스에 그림 넣기 (UI 아이콘용)
function iconTo(canvas, icon){
  const g = canvas.getContext('2d'); g.imageSmoothingEnabled = false; g.clearRect(0, 0, canvas.width, canvas.height);
  if (!icon || !ATL) return;
  if (icon[0] === 'd'){ const f = ATL.f[icon.slice(2)]; if (!f) return; const s = Math.min(canvas.width / f[2], canvas.height / f[3]); const w = f[2]*s, h = f[3]*s; g.drawImage(IMD, f[0], f[1], f[2], f[3], (canvas.width - w)/2, (canvas.height - h)/2, w, h); }
  else if (icon[0] === 'i'){ const n = ATL.items[icon.slice(2)]; if (n == null) return; const c = ATL.icell, col = ATL.icols; g.drawImage(IMI, (n % col) * c, Math.floor(n / col) * c, c, c, 0, 0, canvas.width, canvas.height); }
  else if (icon[0] === 'p'){ const pc = petCanvas(icon.slice(2)); g.drawImage(pc, 0, 0, pc.width, pc.height, 0, 0, canvas.width, canvas.height); }
}
const ICV = (icon, w, h) => { const c = document.createElement('canvas'); c.width = w || 56; c.height = h || 56; iconTo(c, icon); return c; };
// HTML 안에 아이콘 캔버스를 넣기 위한 자리표시
let iconQ = [];
const iconPH = (icon, w, h) => { iconQ.push([icon, w, h]); return '<canvas data-ic="' + (iconQ.length - 1) + '" width="' + (w||56) + '" height="' + (h||56) + '"></canvas>'; };
function flushIcons(root){ root.querySelectorAll('canvas[data-ic]').forEach(c => { const q = iconQ[+c.dataset.ic]; if (q) iconTo(c, q[0]); c.removeAttribute('data-ic'); }); iconQ = []; }

// =================== 소리 (직접 합성) ===================
let AC = null;
function audioInit(){ if (AC) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
function tone(f, d, type, vol, slide, delay){
  if (!AC) return; const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, vol, hp){ if (!AC) return; const n = AC.createBufferSource(), b = AC.createBuffer(1, AC.sampleRate * d, AC.sampleRate), a = b.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = (Math.random()*2-1) * (1 - i/a.length);
  n.buffer = b; const g = AC.createGain(); g.gain.value = vol || 0.12; const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 800; n.connect(f).connect(g).connect(AC.destination); n.start(); }
let sfxOn = lsGet('lumi_sfx') !== '0', sfxT = {};
function sfx(k){
  if (!sfxOn || !AC) return; const now = performance.now(); if (sfxT[k] && now - sfxT[k] < 50) return; sfxT[k] = now;
  if (k === 'hit') noise(0.06, 0.06, 1500);
  else if (k === 'crit'){ noise(0.1, 0.12, 900); tone(180, 0.12, 'square', 0.05, 0.5); }
  else if (k === 'swing') noise(0.08, 0.04, 3000);
  else if (k === 'coin'){ tone(1320, 0.07, 'square', 0.04); tone(1760, 0.1, 'square', 0.04, 1, 0.05); }
  else if (k === 'pick') tone(660, 0.08, 'triangle', 0.08, 1.5);
  else if (k === 'drop1') tone(520, 0.15, 'triangle', 0.08, 1.3);
  else if (k === 'drop2'){ tone(660, 0.2, 'triangle', 0.1); tone(990, 0.25, 'triangle', 0.08, 1, 0.08); }
  else if (k === 'drop3'){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.5, 'triangle', 0.1, 1, i * 0.07)); tone(80, 0.6, 'sine', 0.2, 0.5); }
  else if (k === 'drop4'){ [392, 523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.7, 'sawtooth', 0.05, 1, i * 0.06)); tone(60, 0.9, 'sine', 0.25, 0.4); noise(0.6, 0.08, 400); }
  else if (k === 'lvl'){ [392, 494, 587, 784].forEach((f, i) => tone(f, 0.35, 'triangle', 0.1, 1, i * 0.09)); }
  else if (k === 'flip') tone(300, 0.08, 'triangle', 0.06, 2);
  else if (k === 'hurt') tone(140, 0.12, 'square', 0.06, 0.6);
  else if (k === 'magic'){ tone(880, 0.25, 'sine', 0.06, 0.4); noise(0.15, 0.04, 2000); }
  else if (k === 'boom'){ noise(0.35, 0.18, 200); tone(90, 0.35, 'sine', 0.2, 0.4); }
  else if (k === 'hatch'){ [262, 330, 392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.45, 'triangle', 0.09, 1, i * 0.1)); }
  else if (k === 'fail'){ tone(220, 0.3, 'sawtooth', 0.06, 0.5); }
}

// =================== 신수 (픽셀 용을 코드로 그림) ===================
const PET_EL = { fire:{n:'화염', c:['#e8401a','#8a1a0a','#ffb060','#ffd040','#ff7020']}, ice:{n:'냉기', c:['#4ab0e8','#1a4a8a','#c8f0ff','#e8faff','#7ad8ff']},
                 bolt:{n:'번개', c:['#e8c81a','#8a6a0a','#fff0a0','#ffffff','#fff060']}, dark:{n:'암흑', c:['#7a3ac8','#2a0a5a','#d0a0ff','#ff5aff','#b070ff']} };
const PET_Q = [ {n:'평범', m:1, c:'#c8c0b0'}, {n:'우수', m:1.25, c:'#6f9bff'}, {n:'희귀', m:1.55, c:'#ffe14a'}, {n:'전설', m:2, c:'#ff8a1e'} ];
const PET_STAGE = [ {n:'신비한 알', lv:0, sz:14}, {n:'새끼 용', lv:1, sz:20}, {n:'어린 용', lv:10, sz:26}, {n:'성룡', lv:20, sz:32}, {n:'신수', lv:30, sz:36} ];
const PETC = {};
function petCanvas(key){   // key = stage_el_frame
  if (PETC[key]) return PETC[key];
  const [st, el, fr] = key.split('_'); const S = +st, P2 = PET_EL[el] || PET_EL.fire, sz = PET_STAGE[S].sz, f = +fr || 0;
  const c = document.createElement('canvas'); c.width = c.height = sz; const g = c.getContext('2d');
  const [body, dark, belly, eye, glow] = P2.c;
  const E = (x, y, rx, ry, col) => { g.fillStyle = col; g.beginPath(); g.ellipse(x*sz, y*sz, Math.max(0.6, rx*sz), Math.max(0.6, ry*sz), 0, 0, Math.PI*2); g.fill(); };
  const T3 = (pts, col) => { g.fillStyle = col; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0]*sz, p[1]*sz) : g.moveTo(p[0]*sz, p[1]*sz)); g.closePath(); g.fill(); };
  if (S === 0){ // 알
    E(0.5, 0.56, 0.38, 0.42, belly); E(0.5, 0.6, 0.34, 0.36, body);
    E(0.42, 0.45, 0.17, 0.2, belly);
    [[0.35,0.7],[0.62,0.4],[0.6,0.75],[0.3,0.48]].forEach(p => E(p[0], p[1], 0.07, 0.06, dark));
    if (f) E(0.38, 0.32, 0.06, 0.05, '#fff');
  } else {
    const k = S, flap = f ? -0.06 : 0.04;
    // 날개 (뒤쪽)
    if (k >= 1){ const wsz = 0.12 + k*0.06; T3([[0.42, 0.5], [0.42 - wsz*0.6, 0.48 - wsz*1.6 + flap], [0.42 - wsz*1.4, 0.42 - wsz + flap], [0.38 - wsz*0.4, 0.58]], dark);
      T3([[0.44, 0.52], [0.44 - wsz*0.5, 0.5 - wsz*1.3 + flap], [0.44 - wsz*1.1, 0.46 - wsz*0.7 + flap], [0.4, 0.58]], body); }
    // 꼬리
    g.strokeStyle = body; g.lineCap = 'round'; g.lineWidth = Math.max(2, sz * (0.08 + 0.01*k)); g.beginPath(); g.moveTo(0.36*sz, 0.7*sz); g.quadraticCurveTo(0.12*sz, 0.82*sz, 0.08*sz, 0.6*sz + (f ? 1 : 0)); g.stroke();
    T3([[0.05, 0.62], [0.02, 0.5], [0.14, 0.56]], glow);
    // 몸
    E(0.48, 0.66, 0.2 + 0.01*k, 0.17, body); E(0.52, 0.7, 0.11, 0.1, belly);
    // 다리
    g.fillStyle = dark; g.fillRect(0.38*sz, 0.78*sz, Math.max(2, 0.08*sz), 0.12*sz); g.fillRect(0.56*sz, 0.78*sz, Math.max(2, 0.08*sz), 0.12*sz);
    // 목·머리
    const hr = k === 1 ? 0.19 : 0.15;
    E(0.6, 0.52, 0.09, 0.12, body);
    E(0.68, 0.38 + (f ? 0.01 : 0), hr, hr * 0.9, body); E(0.82, 0.43, hr*0.55, hr*0.42, body); E(0.8, 0.47, hr*0.45, hr*0.25, belly);
    // 뿔
    if (k >= 2){ T3([[0.6, 0.27], [0.54, 0.1 - 0.02*k], [0.65, 0.24]], belly); T3([[0.7, 0.25], [0.7, 0.08 - 0.02*k], [0.76, 0.25]], belly); }
    if (k >= 4){ T3([[0.55, 0.32], [0.38, 0.18], [0.56, 0.37]], glow); }
    // 눈
    g.fillStyle = eye; g.fillRect(Math.round(0.72*sz), Math.round(0.33*sz), Math.max(2, Math.round(0.07*sz)), Math.max(2, Math.round(0.07*sz)));
    g.fillStyle = '#000'; g.fillRect(Math.round(0.75*sz), Math.round(0.34*sz), 1, Math.max(1, Math.round(0.05*sz)));
    // 등 가시
    if (k >= 3) for (let i = 0; i < 4; i++) T3([[0.3 + i*0.07, 0.52 - i*0.01], [0.33 + i*0.07, 0.44 - i*0.02], [0.36 + i*0.07, 0.53 - i*0.01]], glow);
  }

  const id = g.getImageData(0, 0, sz, sz), d = id.data, solid = i => d[i*4+3] > 110;
  for (let i = 0; i < sz*sz; i++) d[i*4+3] = d[i*4+3] > 110 ? 255 : 0;
  const out = new Uint8ClampedArray(d);
  for (let y = 0; y < sz; y++) for (let x = 0; x < sz; x++){ const i = y*sz + x; if (solid(i)) continue;
    const n = (x > 0 && solid(i-1)) || (x < sz-1 && solid(i+1)) || (y > 0 && solid(i-sz)) || (y < sz-1 && solid(i+sz));
    if (n){ out[i*4] = 12; out[i*4+1] = 6; out[i*4+2] = 14; out[i*4+3] = 255; } }
  g.putImageData(new ImageData(out, sz, sz), 0, 0);
  return PETC[key] = c;
}

    if (a === 'sell0'){ let g = 0, n = 0; P.bag = P.bag.filter(x => { if (x.rar <= 1 && !x.unid){ g += sellPrice(x); n++; return false; } return true; }); P.gold += g; toast(n ? n + '개 판매 · 💰' + fmt(g) : '팔 장비가 없어요'); if (n) sfx('coin'); bagSel = -1; }

    ST = calc(); save(); keepScroll(openBag);

function revealSeq(items, done){

  B.innerHTML = '<div class="note" style="text-align:center">카드를 눌러 하나씩 열거나 「모두 열기」를 누르세요</div><div class="cards">' + items.map((it, i) => '<div class="card r' + it.rar + '" data-i="' + i + '"><div class="fr b' + it.rar + '" style="box-shadow:inset 0 0 18px ' + hexA(RAR[it.rar].col, 0.35) + '">?</div><div class="bk g' + it.rar + ' b' + it.rar + '"><canvas width="56" height="56"></canvas><small class="r' + it.rar + '">' + esc(it.name) + '</small></div></div>').join('') + '</div><div id="idTip"></div><div class="acts2"><button class="btn gold" id="idAll">✦ 모두 열기</button><button class="btn" id="idOk">확인</button></div>';
  M.classList.add('on');
  B.querySelectorAll('.card').forEach(c => { const it = items[+c.dataset.i]; iconTo(c.querySelector('canvas'), it.icon); });
  let opened = 0;
  const open = c => { if (c.classList.contains('open')) { showTip(items[+c.dataset.i]); return; } const it = items[+c.dataset.i]; it.unid = false; c.classList.add('open'); opened++;
    sfx(it.rar >= 4 ? 'drop4' : it.rar === 3 ? 'drop3' : it.rar === 2 ? 'drop2' : 'flip');
    if (it.rar >= 3){ flashScreen(it.rar === 4 ? 'rgba(255,40,80,.45)' : 'rgba(255,140,30,.4)'); M.querySelector('.box').animate([{ transform:'translateX(-6px)' }, { transform:'translateX(6px)' }, { transform:'translateX(0)' }], { duration:220, iterations:2 }); }
    if (P.q.acc && Q().type === 'ident'){ P.q.c++; if (P.q.c === Q().n) toast('📜 퀘스트 완료! 수호천사 세라에게'); }
    showTip(it); save(); };
  const showTip = it => { $('idTip').innerHTML = tipHTML(it, P.eq[it.slot] || null); };
  B.querySelectorAll('.card').forEach(c => c.onclick = () => open(c));
  $('idAll').onclick = () => { const cs = [...B.querySelectorAll('.card:not(.open)')]; cs.sort((a, b) => items[+a.dataset.i].rar - items[+b.dataset.i].rar); cs.forEach((c, k) => setTimeout(() => open(c), k * 260)); };
  const close = () => { items.forEach(it => { if (it.unid && P.q.acc && Q().type === 'ident') P.q.c++; it.unid = false; }); M.classList.remove('on'); save(); done && done(); };
  $('idOk').onclick = close; $('idX').onclick = close;
}

  const xp = Math.round(kills * m.xp * xm * (1 + ST.xp/100)), gold = Math.round(kills * m.gold * (1 + ST.gold/100));
  let nItems = Math.floor(kills * (0.13 + ST.mf/400)), got = [], dust = 0;
  const M = P.mat || (P.mat = { dust:0, crys:0, ess:0 });
  for (let i = 0; i < Math.min(nItems, 400); i++){ const rar = rollRar(ST.mf); if (rar === 0){ dust += 2; continue; } if (P.bag.length + got.length >= BAG_MAX){ dust += 4; continue; } const it = mkItem(pick(SLOTS), P.cls, m.lv, rar); it.unid = true; got.push(it); }
  M.dust += dust; P.bag.push(...got); P.gold += gold; gainXp(xp);
  if (P.pet) for (let k = 0; k < Math.min(kills, 600); k++) petGain(Math.round(m.xp * 0.35 * xm));
  P.kills = (P.kills || 0) + kills;
  const h = Math.floor(away / 3600), mm = Math.floor(away % 3600 / 60), cnt = [0,0,0,0,0]; got.forEach(i => cnt[i.rar]++);
  setTimeout(() => {
    modal('🌙 자리를 비운 동안', '<div style="text-align:center"><div class="serif" style="font-size:5cqw;color:#ffd88a">' + (h ? h + '시간 ' : '') + mm + '분 동안 사냥했어요</div><div class="note" style="margin-top:1cqw">' + Z.name + '</div></div>' +
      '<div class="kv"><div>처치<b>' + fmt(kills) + '</b></div><div>경험치<b>' + fmt(xp) + '</b></div><div>골드<b>💰' + fmt(gold) + '</b></div><div>마력 가루<b>' + dust + '</b></div></div>' +
      (got.length ? '<div class="sec" style="text-align:center">✦ 미확인 전리품 ' + got.length + '개 ✦</div><div style="text-align:center;font-size:3.4cqw">' + cnt.map((c, i) => c ? '<span class="r' + i + '">' + RAR[i].n + ' ' + c + '</span>' : '').filter(Boolean).join(' · ') + '</div>' +
        '<div class="grid" style="margin-top:2cqw">' + got.slice(0, 18).map(it => '<div class="slot g' + it.rar + ' b' + it.rar + '">' + iconPH(it.icon, 48, 48) + '<span class="q r' + it.rar + '">?</span></div>').join('') + '</div><div class="note" style="text-align:center;margin-top:2cqw">성채의 감정사 오르도에게 가져가 감정하세요!</div>' : '') +
      '<button class="btn gold big" id="offOk">좋아요!</button>');
    $('offOk').onclick = closeModal; if (got.some(i => i.rar >= 3)) sfx('drop3'); else sfx('lvl');
  }, 900);
}

// =================== 저장 ===================
function save(){ if (!P) return; P.ts = Date.now(); const o = Object.assign({}, P); delete o.target; o.buff = {}; o.cd = [0,0,0]; o.x = Math.round(P.x); o.y = Math.round(P.y); o.dead = false; lsSet(SAVE_KEY, JSON.stringify(o)); }
function load(){ try { const s = lsGet(SAVE_KEY); if (!s) return null; const o = JSON.parse(s); return o && o.cls ? o : null; } catch(e){ return null; } }
addEventListener('visibilitychange', () => { if (document.hidden) save(); else if (P && !$('title').classList.contains('hide')) {} });
addEventListener('pagehide', save);
function newPlayer(cls, g, nick){
  const C = CLASSES[cls], w = mkItem('weapon', cls, 1, 0, { known:true }), a = mkItem('armor', cls, 1, 0, { known:true });
  return { v:2, nick, cls, g, lv:1, xp:0, gold:120, pts:0, st:{ ...C.base }, hp:9999, mp:9999, eq:{ weapon:w, armor:a }, bag:[], pots:{ hp:5, mp:3 }, scrolls:1, food:0, mat:{ dust:0, crys:0, ess:0 },
    q:{ i:0, c:0, done:false, acc:false }, cd:[0,0,0], buff:{}, where:'town', lastHunt:null, ts:Date.now() };
}

// =================== 시작 화면 ===================
let selCls = 'knight', selG = 'm', confirmNew = false;
function title(){
  const sel = $('clsSel');
  sel.innerHTML = Object.entries(CLASSES).map(([k, C]) => '<div class="cl' + (k === selCls ? ' on' : '') + '" data-k="' + k + '"><canvas width="16" height="28"></canvas><b>' + C.name + '</b><small>' + C.desc + '</small></div>').join('');
  sel.querySelectorAll('.cl').forEach(el => { el.onclick = () => { selCls = el.dataset.k; audioInit(); sfx('flip'); title(); }; const c = el.querySelector('canvas'), f = ATL.f[CLASSES[el.dataset.k].spr[selG] + '_idle_anim_f0']; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(IMD, f[0], f[1], f[2], f[3], 0, 0, 16, 28); });
  document.querySelectorAll('#gsel button').forEach(b => { b.classList.toggle('on', b.dataset.g === selG); b.onclick = () => { selG = b.dataset.g; title(); }; });
  const old = load(); if (old){ $('contB').classList.remove('hide'); $('contB').innerHTML = '이어하기 · ' + esc(old.nick) + ' (' + CLASSES[old.cls].name + ' Lv.' + old.lv + ')'; }
}
$('startB').onclick = () => {
  audioInit(); const nick = $('nick').value.trim();
  if (nick.length < 2){ toast('이름을 2글자 이상 적어주세요'); $('nick').focus(); return; }
  if (load() && !confirmNew){ confirmNew = true; $('startB').textContent = '⚠ 기존 캐릭터가 지워져요 · 다시 누르기'; return; }
  P = newPlayer(selCls, selG, nick); startGame(true);
};
$('contB').onclick = () => { audioInit(); P = load(); if (!P) return; startGame(false); };
function startGame(fresh){
  $('title').classList.add('hide'); P.cd = [0,0,0]; P.buff = {}; P.dead = false; ST = calc(); P.hp = Math.min(P.hp, ST.maxHp); P.mp = Math.min(P.mp, ST.maxMp);
  if (!fresh) offline();
  enterTown();
  if (fresh){ setTimeout(() => banner('루미에르 성채', '수호천사 세라(!)에게 말을 걸어보세요'), 300); setTimeout(() => toast('💡 화면을 누르면 그곳으로 걸어가요'), 1800); }
}
// 시작 화면 배경: 어두운 던전 + 불씨
const tb = $('tbg'), tg = tb.getContext('2d'); const embers = Array.from({ length:50 }, () => ({ x:Math.random(), y:Math.random(), v:rnd(0.02, 0.08), s:rnd(1, 3) }));
function titleBg(dt){
  if ($('title').classList.contains('hide') || !ATL) return; tb.width = 180; tb.height = 320; tg.imageSmoothingEnabled = false;
  for (let y = 0; y < 20; y++) for (let x = 0; x < 12; x++){ const f = ATL.f[(x * 7 + y * 3) % 9 === 0 ? 'floor_3' : 'floor_1']; tg.drawImage(IMD, f[0], f[1], 16, 16, x*16, y*16, 16, 16); }
  for (let x = 0; x < 12; x++){ const f = ATL.f['wall_mid'], t = ATL.f['wall_top_mid']; tg.drawImage(IMD, t[0], t[1], 16, 16, x*16, 96, 16, 16); tg.drawImage(IMD, f[0], f[1], 16, 16, x*16, 112, 16, 16); }
  const fi = Math.floor(T*6) % 3, fm = ATL.f['wall_fountain_mid_red_anim_f' + fi], fb = ATL.f['wall_fountain_basin_red_anim_f' + fi]; tg.drawImage(IMD, fm[0], fm[1], 16, 16, 82, 112, 16, 16); tg.drawImage(IMD, fb[0], fb[1], 16, 16, 82, 128, 16, 16);
  const g = tg.createRadialGradient(90, 150, 10, 90, 150, 170); g.addColorStop(0, 'rgba(0,0,0,.2)'); g.addColorStop(1, 'rgba(0,0,0,.92)'); tg.fillStyle = g; tg.fillRect(0, 0, 180, 320);
  for (const e of embers){ e.y -= e.v * dt; e.x += Math.sin(T + e.y * 10) * 0.0006; if (e.y < 0){ e.y = 1; e.x = Math.random(); } tg.fillStyle = 'rgba(255,' + (120 + Math.floor(e.s*40)) + ',40,' + (0.5 + 0.5*Math.sin(T*4 + e.x*30)) + ')'; tg.fillRect(Math.floor(e.x*180), Math.floor(e.y*320), Math.ceil(e.s/1.5), Math.ceil(e.s/1.5)); }
}

// =================== 루프 ===================
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (P && MAP && $('title').classList.contains('hide')){ update(dt); render(dt); hud(dt); }
  else { T += dt; titleBg(dt); }
  requestAnimationFrame(frame);
}
resize();
loadAssets().then(() => {
  ['pHp','pMp'].forEach((id, i) => iconTo($(id).querySelector('canvas'), i ? 'd:flask_big_blue' : 'd:flask_big_red'));
  title(); requestAnimationFrame(frame);
});
</script>
</body>
</html>
