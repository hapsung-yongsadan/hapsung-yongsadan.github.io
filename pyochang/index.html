<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>합성용사단 표창 시안</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:#0d0a08;overflow:hidden;font-family:'Noto Sans KR',sans-serif;color:#fff;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;justify-content:center;align-items:center}
  #stage{position:relative;aspect-ratio:9/16;height:100%;max-width:100%;overflow:hidden;background:#1a2a14;container-type:size}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .top{position:absolute;left:0;right:0;top:0;padding:2.2% 3% 0;display:flex;gap:2cqw;align-items:center;z-index:5;pointer-events:none}
  .stg{font-family:Jua;font-size:4.6cqw;text-shadow:0 2px 0 #000}
  .stg small{display:block;font-family:'Noto Sans KR';font-weight:700;font-size:2.6cqw;color:#f2c86a}
  .pill{margin-left:auto;display:flex;align-items:center;gap:1cqw;background:rgba(22,16,12,.85);border:1.5px solid rgba(242,200,106,.55);border-radius:99px;padding:.6cqw 2.6cqw .6cqw .6cqw;font-family:Jua;font-size:4cqw;min-width:24cqw}
  .pill img{width:7cqw;height:7cqw}
  .pill span{margin-left:auto}
  .btns{position:absolute;left:3%;right:3%;bottom:2.2%;display:flex;gap:2cqw;z-index:6}
  .btns button{flex:1;font-family:Jua;font-size:3.8cqw;color:#fff;border-radius:14px;padding:2.2cqw 0 1.8cqw;border:2px solid #f2c86a;
    background:linear-gradient(180deg,#8a5d22,#4a2f10);box-shadow:0 4px 0 #2a1806,0 0 12px rgba(0,0,0,.5);line-height:1.15}
  .btns button small{display:block;font-size:3cqw;color:#ffe39a}
  .btns button:active{transform:translateY(3px);box-shadow:0 1px 0 #2a1806}
  .btns button.off{filter:grayscale(.8) brightness(.7)}
  .btns button.blue{background:linear-gradient(180deg,#2e6a9a,#173a5a);border-color:#9fd4ff;box-shadow:0 4px 0 #0c2236}
  #toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:9;font-family:Jua;font-size:5cqw;padding:2cqw 5cqw;border-radius:14px;background:rgba(0,0,0,.75);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  #banner{position:absolute;left:0;right:0;top:24%;z-index:8;text-align:center;pointer-events:none;opacity:0;font-family:Jua;font-size:10cqw;color:#ffde7a;text-shadow:0 4px 0 #6b1d0c,0 0 30px rgba(255,90,40,.9)}
  #banner.show{animation:bn 2s ease-out forwards}
  @keyframes bn{0%{opacity:0;transform:scale(2.2)}12%{opacity:1;transform:scale(.95)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
  .back{position:absolute;left:3%;top:9%;z-index:7;font-family:Jua;font-size:3cqw;color:#e9dcc0;background:rgba(22,16,12,.85);border:1.5px solid rgba(242,200,106,.35);border-radius:10px;padding:1cqw 2.4cqw;text-decoration:none}
  #load{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#120c08;font-family:Jua;font-size:6cqw;color:#f2c86a;transition:opacity .4s}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div class="top">
    <div class="stg"><span id="stgName">초록 들판 1</span><small id="stgSub">보스까지 0 / 15</small></div>
    <div class="pill"><img src="../proto2d/img/i_gold.png" alt=""><span id="gold">0</span></div>
  </div>
  <a class="back" href="../bunker/">벙커 디펜스 시안 보기 ▶</a>
  <div id="banner">보스 등장!</div>
  <div id="toast"></div>
  <div class="btns">
    <button id="bSum">표창 뽑기<small id="cSum">💰 20</small></button>
    <button id="bAuto" class="blue">자동 합성<small>같은 것 합치기</small></button>
    <button id="bAtk">공격 속도<small id="cAtk">💰 60</small></button>
  </div>
  <div id="load">불러오는 중…</div>
</div></div>
<script>
(() => {
const W = 720, H = 1280;
const cv = document.getElementById('cv'), cx = cv.getContext('2d'), stage = document.getElementById('stage');
function fit(){ const r = stage.getBoundingClientRect(), d = Math.min(2, devicePixelRatio||1); cv.width = Math.round(r.width*d); cv.height = Math.round(r.height*d); }
addEventListener('resize', fit); fit();

const SRC = { g:'g00', hero:'h03', m0:'a00_m0', m1:'a00_m1', m2:'a00_m2', m3:'a00_m3', boss:'boss00', shock:'shock', boom:'explosion', coin:'i_gold', star:'star', ring:'circle_gold' };
const IMG = {}, BOX = {};
const load = () => Promise.all(Object.entries(SRC).map(([k,f]) => new Promise(r => { const im = new Image(); im.onload = () => { IMG[k]=im; BOX[k]=bbox(im); r(); }; im.onerror = r; im.src = '../proto2d/img/'+f+'.png'; })));
function bbox(im){ const c = document.createElement('canvas'), s = 128/Math.max(im.width,im.height); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
  const g = c.getContext('2d'); g.drawImage(im,0,0,c.width,c.height); let d; try{ d = g.getImageData(0,0,c.width,c.height).data; }catch(e){ return {x0:0,y0:0,x1:im.width,y1:im.height}; }
  let x0=c.width,y0=c.height,x1=0,y1=0; for(let y=0;y<c.height;y++) for(let x=0;x<c.width;x++) if(d[(y*c.width+x)*4+3]>40){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  return {x0:x0/s,y0:y0/s,x1:(x1+1)/s,y1:(y1+1)/s}; }
const FLASH = {};
function flashImg(k){ if (FLASH[k]) return FLASH[k]; const im = IMG[k], c = document.createElement('canvas'); c.width=im.width; c.height=im.height; const g=c.getContext('2d'); g.drawImage(im,0,0); g.globalCompositeOperation='source-in'; g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); return FLASH[k]=c; }
const rnd = (a,b) => a+Math.random()*(b-a), clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const ease = { out:t=>1-Math.pow(1-t,3), inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, back:t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);} };
let shake=0, hitStop=0, time=0;

// ---------- 표창 등급 색 ----------
const PAL = [ ['#d9d9d9','#7b7b7b'], ['#f0b37a','#8a4b1c'], ['#eaf4ff','#7f93a8'], ['#ffe27a','#b37a10'], ['#9dff9a','#1f8a2a'],
  ['#8fd8ff','#1a5f9e'], ['#e2a8ff','#6a22a0'], ['#ff9a8a','#a0201a'], ['#fff6c0','#ff5ab4'], ['#ffffff','#40e0ff'] ];
const pal = lv => PAL[Math.min(PAL.length-1, lv-1)];
const NAMES = ['나무','청동','강철','황금','비취','청옥','자수정','홍염','천상','신화'];
function drawShuriken(x, y, r, rot, lv, alpha){
  const [c1, c2] = pal(lv); cx.save(); cx.translate(x,y); cx.rotate(rot); if (alpha!=null) cx.globalAlpha = alpha;
  const pts = lv >= 7 ? 6 : lv >= 4 ? 5 : 4;
  cx.beginPath();
  for (let i=0;i<pts*2;i++){ const a = i*Math.PI/pts, rr = i%2===0 ? r : r*0.38; const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    if (i===0) cx.moveTo(px,py); else { const am = a - Math.PI/pts*0.5, cr = i%2===0 ? r*0.62 : r*0.55; cx.quadraticCurveTo(Math.cos(am)*cr, Math.sin(am)*cr, px, py); } }
  cx.closePath();
  const g = cx.createRadialGradient(-r*0.2,-r*0.2,r*0.05,0,0,r); g.addColorStop(0,'#fff'); g.addColorStop(0.35,c1); g.addColorStop(1,c2);
  cx.fillStyle = g; cx.fill(); cx.lineWidth = Math.max(2, r*0.09); cx.strokeStyle = 'rgba(20,10,5,.85)'; cx.stroke();
  cx.beginPath(); cx.arc(0,0,r*0.16,0,Math.PI*2); cx.fillStyle='#2a1a10'; cx.fill(); cx.lineWidth=2; cx.strokeStyle=c1; cx.stroke();
  cx.restore();
}

// ---------- 상태 ----------
let gold = 60, goldShown = 60, stageNo = 1, kills = 0, bossOn = false, sumCost = 20, atkLv = 1, atkCost = 60;
const KB = 15;
const AREA = ['초록 들판','이끼 숲','안개 늪','바람 언덕','붉은 화산'];
const hero = { x:150, y:660, h:240, hp:1000, max:1000, t:0, throwK:0, flash:0, hurtT:0 };
const mobs = [], shots = [], fx = [], nums = [], coins = [];

// ---------- 합성 칸 (4 x 3) ----------
const GX = 64, GY = 830, CW = 148, CH = 112, COLS = 4, ROWS = 3;
const grid = new Array(COLS*ROWS).fill(0);
grid[0] = 1; grid[1] = 1; grid[2] = 2;
const slotPos = i => ({ x: GX + (i%COLS)*CW + CW/2, y: GY + Math.floor(i/COLS)*CH + CH/2 });
const best = () => Math.max(1, ...grid);
const pop = {}; // 합성 효과 타이머
let drag = null;

function dmgOf(lv){ return Math.round(24 * Math.pow(1.75, lv-1)); }
function rate(){ return 0.42 * Math.pow(0.9, atkLv-1); }

// ---------- 몬스터 ----------
function mobHp(){ return Math.round(90 * Math.pow(1.45, stageNo-1)); }
function spawn(boss){
  const m = { k: boss ? 'boss' : 'm'+Math.floor(rnd(0,4)), boss, x: W+100, y: boss ? 620 : rnd(450, 720), h: boss ? 300 : rnd(130,165),
    sp: boss ? 70 : rnd(95,135), flash:0, kb:0, sq:0, dead:0, phase:rnd(0,6), hop:0, atk:rnd(0,1) };
  m.hp = m.max = boss ? mobHp()*28 : mobHp(); mobs.push(m); return m; }
for (let i=0;i<3;i++){ const m = spawn(false); m.x = rnd(420, 680); }

function nearest(){ let b=null, bd=1e9; for (const m of mobs){ if (m.dead || m.x > W+20) continue; const d = m.x - hero.x; if (d < bd){ bd = d; b = m; } } return b; }
function addFx(o){ o.t=0; fx.push(o); }
function num(x,y,v,crit,col){ nums.push({x:x+rnd(-14,14),y,v,crit,col,t:0}); }
function burst(x,y,n,col){ for(let i=0;i<n;i++){ const a=rnd(0,Math.PI*2), s=rnd(180,480); addFx({type:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-180,life:rnd(.3,.6),col,size:rnd(8,18)}); } }

function hit(m, v, crit, lv){
  if (!m || m.dead) return;
  m.hp -= v; m.flash = 1; m.kb = crit ? 30 : 14; m.sq = 1;
  num(m.x, m.y - m.h*0.95, v, crit);
  addFx({type:'img', k:'shock', x:m.x - 10, y:m.y - m.h*0.5, s0:0.1, s1:crit?0.6:0.4, life:.22, add:true});
  if (crit){ shake = Math.max(shake, 10); hitStop = 0.05; burst(m.x, m.y-m.h*0.5, 8, pal(lv)[0]); }
  if (m.hp <= 0) die(m);
}
function die(m){
  m.dead = 0.001;
  addFx({type:'img', k:'boom', x:m.x, y:m.y-m.h*0.45, s0:m.boss?1.3:0.45, s1:m.boss?2.4:0.9, life:.42, add:true});
  burst(m.x, m.y-m.h*0.45, m.boss?30:10, m.boss?'#ffcf5a':'#c8ff9a');
  const n = m.boss ? 12 : 2, val = Math.round((m.boss ? 60 : 4) * Math.pow(1.3, stageNo-1));
  for (let i=0;i<n;i++) coins.push({x:m.x+rnd(-20,20), y:m.y-m.h*0.4, vx:rnd(-240,240), vy:rnd(-600,-380), land:m.y+rnd(-10,20), phase:0, t:0, val});
  if (m.boss){ shake = 30; hitStop = 0.12; bossOn = false; kills = 0; stageNo++; toast('스테이지 클리어!'); hero.hp = hero.max; }
  else if (!bossOn) kills++;
  updTop();
}
function updTop(){
  document.getElementById('stgName').textContent = AREA[Math.floor((stageNo-1)/5)%AREA.length] + ' ' + (((stageNo-1)%5)+1);
  document.getElementById('stgSub').textContent = bossOn ? '보스 전투 중!' : '보스까지 ' + kills + ' / ' + KB;
}

// ---------- 던지기 ----------
function throwNow(){
  const m = nearest(); if (!m || m.x > W - 30) return;
  const lv = best(); const n = lv >= 9 ? 3 : lv >= 5 ? 2 : 1;
  hero.throwK = 1;
  for (let i=0;i<n;i++){
    const sx = hero.x + 60, sy = hero.y - hero.h*0.55;
    const spread = (i - (n-1)/2) * 46;
    const crit = Math.random() < 0.18;
    shots.push({ x:sx, y:sy, m, lv, crit, v: Math.round(dmgOf(lv) * (crit ? 2.3 : 1) * rnd(0.9,1.1)), rot:rnd(0,6), off:spread, t:0, trail:[] });
  }
}
function updShots(dt){
  for (let i=shots.length-1;i>=0;i--){ const s = shots[i]; s.t += dt;
    let m = s.m; if (!m || m.dead){ m = s.m = nearest(); if (!m){ shots.splice(i,1); continue; } }
    const tx = m.x, ty = m.y - m.h*0.5 + s.off*Math.max(0, 1 - s.t*3);
    const dx = tx - s.x, dy = ty - s.y, d = Math.hypot(dx,dy), sp = 1500*dt;
    s.trail.push({x:s.x,y:s.y}); if (s.trail.length > 6) s.trail.shift();
    s.rot += dt * 26;
    if (d <= sp + 10){ hit(m, s.v, s.crit, s.lv); shots.splice(i,1); continue; }
    s.x += dx/d*sp; s.y += dy/d*sp;
  }
}

// ---------- 합성 ----------
function toast(t){ const e = document.getElementById('toast'); e.textContent = t; e.style.opacity = 1; clearTimeout(e._t); e._t = setTimeout(()=>e.style.opacity=0, 1100); }
function summon(free){
  const i = grid.indexOf(0); if (i < 0){ if (!free) toast('칸이 가득 찼어요 · 합성해 주세요'); return false; }
  if (!free){ if (gold < sumCost){ toast('골드가 부족해요'); return false; } gold -= sumCost; goldShown = Math.min(goldShown, gold); sumCost = Math.round(sumCost * 1.06 + 1); }
  const base = Math.max(1, best() - 4);
  grid[i] = Math.random() < 0.12 ? base + 1 : base; pop[i] = { t:0, kind:'new' };
  updBtns(); return true;
}
function merge(a, b){ // a를 b로
  grid[b] = grid[b] + 1; grid[a] = 0; pop[b] = { t:0, kind:'merge' };
  const p = slotPos(b); burst(p.x, p.y, 14, pal(grid[b])[0]); shake = Math.max(shake, 5);
  if (grid[b] === best() && grid[b] >= 2) toast(NAMES[Math.min(9,grid[b]-1)] + ' 표창 장착!');
}
function autoMerge(){
  let did = false;
  for (let lv = 1; lv < 20; lv++){ const idx = []; grid.forEach((v,i)=>{ if (v===lv) idx.push(i); });
    while (idx.length >= 2){ const a = idx.pop(), b = idx.pop(); merge(a, b); did = true; } }
  if (!did) toast('합칠 수 있는 게 없어요');
}
document.getElementById('bSum').onclick = () => summon(false);
document.getElementById('bAuto').onclick = autoMerge;
document.getElementById('bAtk').onclick = () => { if (gold < atkCost){ toast('골드가 부족해요'); return; } gold -= atkCost; goldShown = Math.min(goldShown, gold); atkLv++; atkCost = Math.round(atkCost*1.5); toast('공격 속도 Lv.' + atkLv); updBtns(); };
function updBtns(){ document.getElementById('cSum').textContent = '💰 ' + sumCost.toLocaleString(); document.getElementById('cAtk').textContent = 'Lv.' + atkLv + ' · 💰 ' + atkCost.toLocaleString();
  document.getElementById('bSum').classList.toggle('off', gold < sumCost); document.getElementById('bAtk').classList.toggle('off', gold < atkCost); }

// 끌어서 합치기
function lp(e){ const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H }; }
function slotAt(p){ const c = Math.floor((p.x - GX)/CW), r = Math.floor((p.y - GY)/CH); if (c<0||c>=COLS||r<0||r>=ROWS) return -1; return r*COLS + c; }
cv.addEventListener('pointerdown', e => { const p = lp(e), i = slotAt(p); if (i >= 0 && grid[i]){ drag = { i, x:p.x, y:p.y, lv:grid[i] }; cv.setPointerCapture(e.pointerId); } });
cv.addEventListener('pointermove', e => { if (drag){ const p = lp(e); drag.x = p.x; drag.y = p.y; } });
cv.addEventListener('pointerup', e => { if (!drag) return; const j = slotAt(lp(e)), i = drag.i; drag = null;
  if (j < 0 || j === i) return;
  if (grid[j] === grid[i]) merge(i, j);
  else { const t = grid[j]; grid[j] = grid[i]; grid[i] = t; pop[j] = {t:0,kind:'move'}; } });

// ---------- 그리기 ----------
function drawImgFoot(k, x, y, h, o={}){
  const im = IMG[k], b = BOX[k]; if (!im) return; const bw=b.x1-b.x0, bh=b.y1-b.y0, s=h/bh;
  cx.save(); cx.translate(x,y); if (o.rot) cx.rotate(o.rot); cx.scale((o.sx||1)*(o.flip?-1:1), o.sy||1); if (o.alpha!=null) cx.globalAlpha=o.alpha;
  const dx=-(b.x0+bw/2)*s, dy=-b.y1*s; cx.drawImage(im,dx,dy,im.width*s,im.height*s);
  if (o.flash>0){ cx.globalAlpha=(o.alpha==null?1:o.alpha)*o.flash*0.85; cx.drawImage(flashImg(k),dx,dy,im.width*s,im.height*s); }
  cx.restore(); }
function shadow(x,y,w,a){ cx.save(); cx.translate(x,y); cx.scale(1,0.32); const g=cx.createRadialGradient(0,0,0,0,0,w); g.addColorStop(0,'rgba(0,0,0,'+(0.5*a)+')'); g.addColorStop(1,'rgba(0,0,0,0)'); cx.fillStyle=g; cx.beginPath(); cx.arc(0,0,w,0,Math.PI*2); cx.fill(); cx.restore(); }
function rr(x,y,w,h,r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }
let pat = null;
function drawGround(){
  if (!pat && IMG.g){ const c=document.createElement('canvas'); c.width=c.height=384; c.getContext('2d').drawImage(IMG.g,0,0,384,384); pat=cx.createPattern(c,'repeat'); }
  cx.fillStyle = pat || '#2b4a20'; cx.fillRect(0,0,W,800);
  let g = cx.createLinearGradient(0,0,0,800); g.addColorStop(0,'rgba(10,20,5,.6)'); g.addColorStop(.3,'rgba(10,20,5,0)'); g.addColorStop(.85,'rgba(10,20,5,0)'); g.addColorStop(1,'rgba(10,8,5,.8)');
  cx.fillStyle = g; cx.fillRect(0,0,W,800);
}
function drawPanel(){
  // 아래 합성판
  const g = cx.createLinearGradient(0,770,0,H); g.addColorStop(0,'#3a2716'); g.addColorStop(1,'#1a110a'); cx.fillStyle = g; cx.fillRect(0,770,W,H-770);
  cx.fillStyle = '#f2c86a'; cx.fillRect(0,770,W,4); cx.fillStyle='rgba(0,0,0,.35)'; cx.fillRect(0,774,W,8);
  cx.font = '400 28px Jua'; cx.textAlign='left'; cx.fillStyle = '#f2dca8'; cx.fillText('표창 가방', 64, 815);
  cx.textAlign='right'; cx.font = '400 24px Jua'; cx.fillStyle='#d8c39a';
  const lv = best(); cx.fillText('장착: ' + NAMES[Math.min(9,lv-1)] + ' 표창 Lv.' + lv + '  ·  피해 ' + dmgOf(lv).toLocaleString(), W-64, 815);
  for (let i=0;i<grid.length;i++){ const p = slotPos(i), x = p.x - CW/2 + 6, y = p.y - CH/2 + 6, w = CW-12, h = CH-12;
    cx.fillStyle = 'rgba(0,0,0,.4)'; rr(x,y+4,w,h,16); cx.fill();
    const eq = grid[i] && grid[i] === lv && grid.indexOf(lv) === i;
    const g2 = cx.createLinearGradient(0,y,0,y+h); g2.addColorStop(0, eq ? '#6a4a1a' : '#4a3420'); g2.addColorStop(1, eq ? '#3e2a0e' : '#2a1c10'); cx.fillStyle = g2; rr(x,y,w,h,16); cx.fill();
    cx.lineWidth = eq ? 3 : 2; cx.strokeStyle = eq ? '#f2c86a' : 'rgba(242,200,106,.25)'; rr(x,y,w,h,16); cx.stroke();
    if (!grid[i] || (drag && drag.i === i)) continue;
    let s = 1; const pp = pop[i]; if (pp){ pp.t += 1/60; const k = pp.t/0.35; if (k >= 1) delete pop[i]; else s = pp.kind==='merge' ? 1 + 0.5*Math.sin(k*Math.PI) : ease.back(Math.min(1,k)); }
    // 합칠 수 있는 짝이 있으면 살짝 흔들림
    const pair = grid.filter(v => v === grid[i]).length >= 2;
    const wob = pair ? Math.sin(time*6 + i)*0.12 : 0;
    drawShuriken(p.x, p.y - 8, 34*s, wob + time*0.4, grid[i]);
    cx.font = '400 22px Jua'; cx.textAlign = 'center'; cx.lineWidth = 5; cx.strokeStyle = '#000'; cx.lineJoin='round';
    cx.strokeText('Lv.' + grid[i], p.x, p.y + 44); cx.fillStyle = pal(grid[i])[0]; cx.fillText('Lv.' + grid[i], p.x, p.y + 44);
    if (eq){ cx.font = '400 18px Jua'; cx.fillStyle = '#ffe27a'; cx.strokeText('장착', x+30, y+24); cx.fillText('장착', x+30, y+24); }
  }
  if (drag){ cx.save(); cx.globalAlpha = 0.95; drawShuriken(drag.x, drag.y, 42, time*3, drag.lv); cx.restore();
    const j = slotAt(drag); if (j >= 0 && j !== drag.i && grid[j] === drag.lv){ const p = slotPos(j); cx.strokeStyle='#9dff9a'; cx.lineWidth=4; rr(p.x-CW/2+6,p.y-CH/2+6,CW-12,CH-12,16); cx.stroke(); } }
}
function drawHero(dt){
  hero.throwK = Math.max(0, hero.throwK - dt*6); hero.flash = Math.max(0, hero.flash - dt*6);
  const br = Math.sin(time*3)*0.018, k = hero.throwK;
  shadow(hero.x, hero.y, 80, 1);
  drawImgFoot('hero', hero.x - 8*k, hero.y - 10*k, hero.h, { sx: 1 - br*0.6 + 0.05*k, sy: 1 + br - 0.04*k, flash: hero.flash });
  // 체력바
  const w = 140, x = hero.x - w/2, y = hero.y + 18;
  cx.fillStyle='rgba(0,0,0,.7)'; rr(x-3,y-3,w+6,16,7); cx.fill(); cx.fillStyle='#4fd65a'; rr(x,y,w*clamp(hero.hp/hero.max,0,1),10,5); cx.fill();
}
function drawMob(m){
  const dying = m.dead > 0, d = dying ? Math.min(1, m.dead/0.4) : 0;
  const walking = m.x > 270; const bob = walking ? Math.abs(Math.sin(m.hop))*10 : 0;
  let lunge = 0; if (!walking && !dying){ const a = (m.atk % 1); lunge = a < 0.15 ? -26*Math.sin(a/0.15*Math.PI) : 0; }
  const br = Math.sin(m.phase)*0.03; let sx = 1+br*0.5+m.sq*0.18, sy = 1-br-m.sq*0.16; if (dying){ sx = 1+d*0.4; sy = 1-d*0.9; }
  shadow(m.x+m.kb, m.y, m.h*0.42, 1-d);
  drawImgFoot(m.k, m.x + m.kb + lunge, m.y - bob, m.h, {sx, sy, flash: dying ? 1-d*0.5 : m.flash, alpha: 1-d*d, flip:true});
  if (!dying && !m.boss && m.hp < m.max){ const w=86, x=m.x-w/2+m.kb, y=m.y-m.h-16; cx.fillStyle='rgba(0,0,0,.7)'; rr(x-2,y-2,w+4,12,6); cx.fill(); cx.fillStyle='#e8433a'; rr(x,y,w*Math.max(0,m.hp/m.max),8,4); cx.fill(); }
}
function drawShots(){
  for (const s of shots){
    cx.save(); cx.globalCompositeOperation='lighter';
    s.trail.forEach((p,j) => { cx.globalAlpha = (j+1)/s.trail.length*0.35; cx.fillStyle = pal(s.lv)[0]; cx.beginPath(); cx.arc(p.x,p.y, 10+j*2, 0, Math.PI*2); cx.fill(); });
    cx.restore();
    drawShuriken(s.x, s.y, s.lv >= 5 ? 26 : 22, s.rot, s.lv);
  }
}
function drawFx(dt){
  for (let i=fx.length-1;i>=0;i--){ const f = fx[i]; f.t += dt; const k = f.t/f.life; if (k>=1){ fx.splice(i,1); continue; }
    cx.save();
    if (f.type==='img'){ const im = IMG[f.k]; if (im){ const s = f.s0+(f.s1-f.s0)*ease.out(k), a = k<.15?k/.15:1-(k-.15)/.85; if (f.add) cx.globalCompositeOperation='lighter';
      cx.globalAlpha = clamp(a,0,1); cx.translate(f.x,f.y); const w = 360*s; cx.drawImage(im,-w/2,-w/2,w,w); } }
    else if (f.type==='spark'){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.vy+=900*dt; cx.globalCompositeOperation='lighter'; cx.globalAlpha=1-k; cx.fillStyle=f.col; cx.beginPath(); cx.arc(f.x,f.y,f.size*(1-k*.6)/2,0,Math.PI*2); cx.fill(); }
    cx.restore(); }
}
function drawNums(dt){
  cx.save(); cx.textAlign='center'; cx.lineJoin='round';
  for (let i=nums.length-1;i>=0;i--){ const n = nums[i]; n.t += dt; const life = n.crit?0.95:0.7, k = n.t/life; if (k>=1){ nums.splice(i,1); continue; }
    const p = k<.12 ? ease.back(k/.12) : 1, y = n.y - 60*ease.out(k), size = (n.crit?50:34)*(n.crit?(1.6-.6*p):p);
    cx.globalAlpha = k<.7?1:1-(k-.7)/.3; cx.font = '400 '+size+'px Jua'; const t = n.v.toLocaleString();
    cx.lineWidth = 8; cx.strokeStyle = n.col ? '#3a0000' : n.crit ? '#5a1500' : '#2a1608'; cx.strokeText(t, n.x, y);
    cx.fillStyle = n.col || (n.crit ? '#ffb030' : '#fff'); cx.fillText(t, n.x, y); }
  cx.restore();
}
const goldEl = document.getElementById('gold');
function drawCoins(dt){
  for (let i=coins.length-1;i>=0;i--){ const c = coins[i]; c.t += dt;
    if (c.phase===0){ c.x+=c.vx*dt; c.y+=c.vy*dt; c.vy+=1500*dt; c.vx*=0.98; if (c.y>c.land && c.vy>0){ c.vy*=-0.35; c.vx*=0.6; c.y=c.land; if (Math.abs(c.vy)<80){ c.phase=1; c.t=0; } } }
    else if (c.phase===1){ if (c.t>0.3){ c.phase=2; c.t=0; c.sx=c.x; c.sy=c.y; } }
    else { const u = ease.inOut(Math.min(1,c.t/0.5)); c.x = c.sx+(560-c.sx)*u; c.y = c.sy+(58-c.sy)*u - Math.sin(u*Math.PI)*120; if (u>=1){ coins.splice(i,1); gold += c.val; updBtns(); continue; } }
    if (IMG.coin){ cx.save(); cx.translate(c.x,c.y); cx.scale(Math.abs(Math.cos(time*9+i))*0.6+0.4,1); cx.drawImage(IMG.coin,-21,-21,42,42); cx.restore(); } }
  if (goldShown < gold) goldShown += Math.max(1, Math.ceil((gold-goldShown)*0.2)); else goldShown = gold;
  goldEl.textContent = goldShown.toLocaleString();
}
function drawBossBar(){ const b = mobs.find(m=>m.boss && !m.dead); if (!b) return; const x=90,y=200,w=W-180,r=Math.max(0,b.hp/b.max);
  cx.fillStyle='rgba(15,8,6,.85)'; rr(x-6,y-6,w+12,40,12); cx.fill(); cx.strokeStyle='rgba(242,200,106,.8)'; cx.lineWidth=2.5; rr(x-6,y-6,w+12,40,12); cx.stroke();
  const g = cx.createLinearGradient(0,y,0,y+28); g.addColorStop(0,'#ff6a52'); g.addColorStop(1,'#a8141a'); cx.fillStyle=g; rr(x,y,w*r,28,8); cx.fill();
  cx.font='400 24px Jua'; cx.textAlign='center'; cx.lineWidth=6; cx.strokeStyle='#000'; const t='고블린 왕  '+Math.ceil(r*100)+'%'; cx.strokeText(t,W/2,y+22); cx.fillStyle='#fff'; cx.fillText(t,W/2,y+22); }

// ---------- 루프 ----------
let last = performance.now(), spawnT = 0, freeT = 4;
function frame(now){
  let dt = Math.min(0.05,(now-last)/1000); last = now; time += dt;
  if (hitStop > 0){ hitStop -= dt; dt *= 0.08; }
  // 몹 생성
  spawnT -= dt; const alive = mobs.filter(m=>!m.dead).length;
  if (!bossOn && kills >= KB){ bossOn = true; spawn(true); const bn = document.getElementById('banner'); bn.classList.remove('show'); void bn.offsetWidth; bn.classList.add('show'); shake = 20; updTop(); }
  if (spawnT <= 0 && alive < (bossOn ? 2 : 6)){ spawn(false); spawnT = rnd(0.6, 1.3); }
  for (let i=mobs.length-1;i>=0;i--) if (mobs[i].dead > 0.6) mobs.splice(i,1);
  // 무료 뽑기 (방치 보상)
  freeT -= dt; if (freeT <= 0){ freeT = 5; summon(true); }
  // 던지기
  hero.t -= dt; if (hero.t <= 0){ hero.t = rate(); throwNow(); }
  updShots(dt);
  for (const m of mobs){ m.phase += dt*4; m.flash = Math.max(0,m.flash-dt*7); m.sq = Math.max(0,m.sq-dt*5); m.kb = Math.max(0,m.kb-dt*140);
    if (m.dead){ m.dead += dt; continue; }
    if (m.x > 270 + (m.boss?40:0)){ m.x -= m.sp*dt; m.hop += dt*10; }
    else { m.atk += dt; if (m.atk >= 1){ m.atk = 0; const v = Math.round((m.boss?60:14) * Math.pow(1.25, stageNo-1)); hero.hp -= v; hero.flash = 0.6; num(hero.x, hero.y - hero.h, v, false, '#ff6a5a'); } } }
  hero.hp = Math.min(hero.max, hero.hp + dt*15);
  if (hero.hp <= 0){ hero.hp = hero.max; mobs.length = 0; shots.length = 0; kills = 0; bossOn = false; stageNo = Math.max(1, stageNo-1); toast('밀려났어요 · 표창을 합성해 보세요'); updTop(); }
  // 그리기
  const sc = cv.width/W; cx.setTransform(sc,0,0,sc,0,0);
  shake *= Math.pow(0.002, dt); const ox = rnd(-shake,shake)*0.5, oy = rnd(-shake,shake)*0.5;
  cx.save(); cx.translate(ox,oy); cx.beginPath(); cx.rect(-20,-20,W+40,790); cx.clip();
  drawGround();
  const ents = [{y:hero.y, d:()=>drawHero(dt)}].concat(mobs.map(m=>({y:m.y, d:()=>drawMob(m)}))); ents.sort((a,b)=>a.y-b.y).forEach(e=>e.d());
  drawShots();
  cx.restore();
  drawPanel();
  cx.save(); cx.translate(ox,oy); drawFx(dt); drawNums(dt); cx.restore();
  drawCoins(dt); drawBossBar();
  requestAnimationFrame(frame);
}
load().then(() => { const l = document.getElementById('load'); l.style.opacity = 0; setTimeout(()=>l.remove(),400); updTop(); updBtns(); requestAnimationFrame(t=>{ last=t; frame(t); }); });
})();
</script>
