<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>합성용사단 진화 합성 시안</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:#0d0a08;overflow:hidden;font-family:'Noto Sans KR',sans-serif;color:#fff;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;justify-content:center;align-items:center}
  #stage{position:relative;aspect-ratio:9/16;height:100%;max-width:100%;overflow:hidden;background:#1a2a14;container-type:size}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .top{position:absolute;left:0;right:0;top:0;padding:2.2% 3% 0;display:flex;gap:2cqw;align-items:center;z-index:5;pointer-events:none}
  .stg{font-family:Jua;font-size:4.6cqw;text-shadow:0 2px 0 #000}
  .stg small{display:block;font-family:'Noto Sans KR';font-weight:700;font-size:2.6cqw;color:#f2c86a}
  .pill{margin-left:auto;display:flex;align-items:center;gap:1cqw;background:rgba(22,16,12,.85);border:1.5px solid rgba(242,200,106,.55);border-radius:99px;padding:.6cqw 2.6cqw .6cqw .6cqw;font-family:Jua;font-size:4cqw;min-width:24cqw}
  .pill img{width:7cqw;height:7cqw}
  .pill span{margin-left:auto}
  .btns{position:absolute;left:3%;right:3%;bottom:2.2%;display:flex;gap:2cqw;z-index:6}
  .btns button{flex:1;font-family:Jua;font-size:3.8cqw;color:#fff;border-radius:14px;padding:2.2cqw 0 1.8cqw;border:2px solid #f2c86a;
    background:linear-gradient(180deg,#8a5d22,#4a2f10);box-shadow:0 4px 0 #2a1806,0 0 12px rgba(0,0,0,.5);line-height:1.15}
  .btns button small{display:block;font-size:3cqw;color:#ffe39a}
  .btns button:active{transform:translateY(3px);box-shadow:0 1px 0 #2a1806}
  .btns button.off{filter:grayscale(.8) brightness(.7)}
  .btns button.blue{background:linear-gradient(180deg,#2e6a9a,#173a5a);border-color:#9fd4ff;box-shadow:0 4px 0 #0c2236}
  #toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:9;font-family:Jua;font-size:5cqw;padding:2cqw 5cqw;border-radius:14px;background:rgba(0,0,0,.75);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  #banner{position:absolute;left:0;right:0;top:24%;z-index:8;text-align:center;pointer-events:none;opacity:0;font-family:Jua;font-size:10cqw;color:#ffde7a;text-shadow:0 4px 0 #6b1d0c,0 0 30px rgba(255,90,40,.9)}
  #banner small{display:block;font-size:4.2cqw;color:#fff;text-shadow:0 2px 0 #000}
  #banner.show{animation:bn 2.2s ease-out forwards}
  @keyframes bn{0%{opacity:0;transform:scale(2.2)}12%{opacity:1;transform:scale(.95)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
  .back{position:absolute;left:3%;top:9%;z-index:7;font-family:Jua;font-size:3cqw;color:#e9dcc0;background:rgba(22,16,12,.85);border:1.5px solid rgba(242,200,106,.35);border-radius:10px;padding:1cqw 2.4cqw;text-decoration:none}
  .test{position:absolute;right:3%;top:9%;z-index:7;font-family:Jua;font-size:3cqw;color:#bfe6ff;background:rgba(12,22,36,.85);border:1.5px solid rgba(159,212,255,.5);border-radius:10px;padding:1cqw 2.4cqw}
  .tabs{position:absolute;left:7.8%;top:61.2cqh;height:3.4cqh;display:flex;gap:1.1cqw;z-index:7}
  .tabs button{width:15.6cqw;font-family:Jua;font-size:3.5cqw;color:#d8c39a;background:#2a1c10;border:1.5px solid rgba(242,200,106,.3);border-radius:10px 10px 0 0;position:relative}
  .tabs button.on{color:#fff;background:linear-gradient(180deg,#7a5420,#4a3010);border-color:#f2c86a}
  .tabs button i{position:absolute;top:-1cqw;right:-1cqw;width:2.8cqw;height:2.8cqw;border-radius:50%;background:#ff4d4d;box-shadow:0 0 6px #ff4d4d;display:none}
  .tabs button i.on{display:block}
  .pane{position:absolute;left:0;right:0;top:64.6cqh;height:26.6cqh;overflow-y:auto;background:linear-gradient(180deg,#2e1f12,#1e140b);z-index:6;display:none;padding:1.5cqw 4cqw 3cqw;touch-action:pan-y}
  .pane.on{display:block}
  .pane .hd{font-family:Jua;font-size:3.2cqw;color:#d8c39a;margin:.5cqw 0 1.5cqw}
  .row{display:flex;align-items:center;gap:2.4cqw;background:rgba(0,0,0,.28);border:1.5px solid rgba(242,200,106,.2);border-radius:12px;padding:1.4cqw 2cqw;margin-bottom:1.6cqw}
  .row.eq{border-color:#f2c86a;background:rgba(122,84,32,.35)}
  .row .pic{width:13cqw;height:13cqw;object-fit:contain;flex:none}
  .row .pic.no{filter:brightness(0) opacity(.45)}
  .row .tx{flex:1;min-width:0;font-family:Jua;font-size:3.6cqw;line-height:1.25}
  .row .tx small{display:block;font-family:'Noto Sans KR';font-weight:700;font-size:2.6cqw;color:#e8d8b0}
  .row .st{color:#ffd040;font-size:3cqw}
  .bar{height:1.6cqw;background:rgba(0,0,0,.5);border-radius:9px;margin-top:.8cqw;overflow:hidden}
  .bar b{display:block;height:100%;background:linear-gradient(90deg,#c78bff,#7a3ad0)}
  .row button{flex:none;font-family:Jua;font-size:3.2cqw;color:#fff;border-radius:10px;padding:1.6cqw 2.6cqw;border:1.5px solid #f2c86a;background:linear-gradient(180deg,#8a5d22,#4a2f10);white-space:nowrap}
  .row button.blue{background:linear-gradient(180deg,#2e6a9a,#173a5a);border-color:#9fd4ff}
  .row button:disabled{filter:grayscale(1) brightness(.6)}
  .need{display:flex;align-items:center;gap:1cqw;margin-top:.6cqw;font-family:'Noto Sans KR';font-weight:700;font-size:2.6cqw;color:#e8d8b0}
  .need img{width:6.5cqw;height:6.5cqw}
  .need .ok{color:#9dff9a}.need .ng{color:#ff8a7a}
  #load{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#120c08;font-family:Jua;font-size:6cqw;color:#f2c86a;transition:opacity .4s}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div class="top">
    <div class="stg"><span id="stgName">초록 들판 1</span><small id="stgSub">보스까지 0 / 15</small></div>
    <div class="pill"><img src="../proto2d/img/i_gold.png" alt=""><span id="gold">0</span></div>
  </div>
  <a class="back" href="../hapsung2d/">합친 버전 보기 ▶</a>
  <button class="test" id="bTest">시험용: 10단계 돌 받기</button>
  <div id="banner">진화!<small></small></div>
  <div id="toast"></div>
  <div class="tabs" id="tabs"><button class="on" data-t="0">가방</button><button data-t="1">영웅<i id="dotH"></i></button><button data-t="2">제작<i id="dotC"></i></button></div>
  <div class="pane" id="paneH"></div>
  <div class="pane" id="paneC"></div>
  <div class="btns">
    <button id="bSum">돌 뽑기<small id="cSum">💰 20</small></button>
    <button id="bAuto" class="blue">자동 합성<small>같은 것 합치기</small></button>
    <button id="bAtk">공격 속도<small id="cAtk">💰 60</small></button>
  </div>
  <div id="load">불러오는 중…</div>
</div></div>
<script>
(() => {
const W = 720, H = 1280;
const cv = document.getElementById('cv'), stage = document.getElementById('stage'); let cx = cv.getContext('2d');
function fit(){ const r = stage.getBoundingClientRect(), d = Math.min(2, devicePixelRatio||1); cv.width = Math.round(r.width*d); cv.height = Math.round(r.height*d); }
addEventListener('resize', fit); fit();

const SRC = { g:'g00', h0:'h00', h1:'h03', h2:'h09', h3:'h12', h4:'h17', m0:'a00_m0', m1:'a00_m1', m2:'a00_m2', m3:'a00_m3', boss:'boss00',
  shock:'shock', boom:'explosion', coin:'i_gold', star:'star', ring:'circle_gold', arc:'circle_arcane', slash:'slash', bolt:'lightning', gift:'i_gift' };
const IMG = {}, BOX = {};
const load = () => Promise.all(Object.entries(SRC).map(([k,f]) => new Promise(r => { const im = new Image(); im.onload = () => { IMG[k]=im; BOX[k]=bbox(im); r(); }; im.onerror = r; im.src = '../proto2d/img/'+f+'.png'; })));
function bbox(im){ const c = document.createElement('canvas'), s = 128/Math.max(im.width,im.height); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
  const g = c.getContext('2d'); g.drawImage(im,0,0,c.width,c.height); let d; try{ d = g.getImageData(0,0,c.width,c.height).data; }catch(e){ return {x0:0,y0:0,x1:im.width,y1:im.height}; }
  let x0=c.width,y0=c.height,x1=0,y1=0; for(let y=0;y<c.height;y++) for(let x=0;x<c.width;x++) if(d[(y*c.width+x)*4+3]>40){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  return {x0:x0/s,y0:y0/s,x1:(x1+1)/s,y1:(y1+1)/s}; }
const FLASH = {};
function flashImg(k){ if (FLASH[k]) return FLASH[k]; const im = IMG[k], c = document.createElement('canvas'); c.width=im.width; c.height=im.height; const g=c.getContext('2d'); g.drawImage(im,0,0); g.globalCompositeOperation='source-in'; g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); return FLASH[k]=c; }
const rnd = (a,b) => a+Math.random()*(b-a), clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const ease = { out:t=>1-Math.pow(1-t,3), inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, back:t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);} };
let shake=0, hitStop=0, time=0;

// ---------- 물건 종류 ----------
// 돌(1~10) → 10단계 두 개 합성 시 4종 중 랜덤 진화 → 각자 1~10단계
const MAXLV = 10;
const TYPES = {
  stone: { name:'돌',      hero:'h0', who:'성기사',  names:['조약돌','자갈','돌덩이','단단한 돌','강철석','월석','수정석','마력석','용암석','태초의 돌'] },
  orb:   { name:'마법 구슬', hero:'h2', who:'화염술사', names:['불씨 구슬','화염 구슬','서리 구슬','번개 구슬','폭풍 구슬','심연 구슬','태양 구슬','성운 구슬','혼돈 구슬','창세의 구슬'] },
  sword: { name:'무기',     hero:'h1', who:'검사',    names:['녹슨 검','철검','기사의 검','은빛 대검','청염검','용골검','성검','마검','천둥 대검','전설의 검'] },
  arrow: { name:'화살',     hero:'h3', who:'궁수',    names:['나무 화살','철 화살','깃털 화살','불화살','얼음 화살','번개 화살','바람 화살','독 화살','별빛 화살','신궁의 화살'] },
  egg:   { name:'정령 알',  hero:'h4', who:'정령사',  names:['작은 알','따뜻한 알','빛나는 알','바람 정령','물 정령','불 정령','번개 정령','숲 정령','달 정령','태초 정령'] },
};
const BRANCH = ['orb','sword','arrow','egg'];
const HUE = [28, 200, 52, 280, 130, 0, 185, 310, 45, 330];
const hue = lv => HUE[(lv-1)%10];
// 영웅 위치 (전장 왼쪽)
// 장착한 영웅이 서는 자리 3곳 / 영웅 없이 물건만 떠서 공격하는 자리
const EQ_POS = [ {x:175,y:665}, {x:85,y:545}, {x:295,y:580} ];
const FLOAT_POS = { stone:{x:250,y:430}, orb:{x:60,y:410}, sword:{x:330,y:470}, arrow:{x:140,y:380}, egg:{x:40,y:720} };
// 영웅 보유 정보 (have, star, pieces) · 장착 목록
const own = {}; for (const t in TYPES) own[t] = { have:false, star:0, pieces:0 };
own.stone.have = true; own.stone.star = 1;
let equipped = ['stone'];
const MAX_EQ = 3, MAX_STAR = 5;
const bonus = t => equipped.includes(t) ? 1.5 + 0.4*(own[t].star-1) : 1;
// 영웅 패시브 (장착했을 때만, 별이 오를수록 강해짐)
const has = t => equipped.includes(t);
const PST = t => Math.max(1, own[t].star);
const PASSIVE = {
  stone: { name:'수호의 방패', desc: s => '받는 피해 -' + (20+5*s) + '% · 체력 회복 2배' },
  orb:   { name:'불바다',     desc: s => '구슬이 터진 자리에 ' + (1.5+0.25*s).toFixed(1) + '초간 불길' },
  sword: { name:'연속 베기',   desc: s => (15+5*s) + '% 확률로 검기를 한 번 더' },
  arrow: { name:'약점 사격',   desc: s => '모든 공격 치명타 확률 +' + (5+3*s) + '%' },
  egg:   { name:'감전',       desc: s => '번개 맞은 적이 ' + (0.8+0.2*s).toFixed(1) + '초간 멈춤' },
};
const flames = [];
function callout(x, y, text, col){ nums.push({ x, y, text, col, t:0, crit:false, call:true }); }
const piecesNeed = t => own[t].have ? 10 * own[t].star : 10;
// 제작법: 해당 물건 n단계 이상 1개 + 골드
const RECIPE = { stone:{lv:7, gold:300}, orb:{lv:3, gold:800}, sword:{lv:3, gold:800}, arrow:{lv:3, gold:800}, egg:{lv:3, gold:800} };

// ---------- 물건 그리기 ----------
function glow(x, y, r, col, a){ cx.save(); cx.globalCompositeOperation='lighter'; const g = cx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)'); cx.globalAlpha = a; cx.fillStyle = g; cx.beginPath(); cx.arc(x,y,r,0,Math.PI*2); cx.fill(); cx.restore(); }
const ROCK = [1,0.82,0.95,0.78,1,0.86,0.92,0.8];
function drawItem(t, lv, x, y, r, rot=0, alpha){
  cx.save(); if (alpha != null) cx.globalAlpha = alpha;
  const h = hue(lv);
  if (lv >= 6 || t !== 'stone') glow(x, y, r*1.7, `hsla(${h},100%,65%,1)`, 0.18 + lv*0.03);
  cx.translate(x, y); cx.rotate(rot);
  cx.lineJoin = 'round';
  if (t === 'stone'){
    const sat = lv <= 3 ? 5 + lv*4 : 25 + lv*6, li = lv <= 3 ? 55 + lv*4 : 50;
    cx.beginPath(); ROCK.forEach((k,i) => { const a = i/ROCK.length*Math.PI*2; const px = Math.cos(a)*r*k, py = Math.sin(a)*r*k*0.85; i ? cx.lineTo(px,py) : cx.moveTo(px,py); }); cx.closePath();
    const g = cx.createLinearGradient(-r,-r,r,r); g.addColorStop(0, `hsl(${h},${sat}%,${li+22}%)`); g.addColorStop(0.5, `hsl(${h},${sat}%,${li}%)`); g.addColorStop(1, `hsl(${h},${sat}%,${li-25}%)`);
    cx.fillStyle = g; cx.fill(); cx.lineWidth = r*0.1; cx.strokeStyle = 'rgba(25,15,8,.85)'; cx.stroke();
    cx.fillStyle = 'rgba(255,255,255,.35)'; cx.beginPath(); cx.moveTo(-r*0.5,-r*0.45); cx.lineTo(-r*0.05,-r*0.6); cx.lineTo(-r*0.2,-r*0.2); cx.closePath(); cx.fill();
    if (lv >= 5){ cx.strokeStyle = `hsla(${h},100%,80%,.9)`; cx.lineWidth = r*0.07; cx.beginPath(); cx.moveTo(-r*0.3,r*0.1); cx.lineTo(r*0.05,-r*0.05); cx.lineTo(r*0.2,r*0.3); cx.lineTo(r*0.45,r*0.1); cx.stroke(); }
  } else if (t === 'orb'){
    const g = cx.createRadialGradient(-r*0.3,-r*0.35,r*0.05,0,0,r); g.addColorStop(0,'#fff'); g.addColorStop(0.3,`hsl(${h},100%,70%)`); g.addColorStop(1,`hsl(${h},90%,28%)`);
    cx.fillStyle = g; cx.beginPath(); cx.arc(0,0,r*0.82,0,Math.PI*2); cx.fill(); cx.lineWidth = r*0.08; cx.strokeStyle = 'rgba(20,10,30,.85)'; cx.stroke();
    cx.strokeStyle = `hsla(${h},100%,90%,.8)`; cx.lineWidth = r*0.08; cx.beginPath(); cx.arc(0,0,r*0.5,time*3,time*3+Math.PI*1.1); cx.stroke();
    cx.fillStyle='rgba(255,255,255,.8)'; cx.beginPath(); cx.ellipse(-r*0.32,-r*0.38,r*0.16,r*0.1,-0.6,0,Math.PI*2); cx.fill();
  } else if (t === 'sword'){
    cx.rotate(-Math.PI/4);
    const len = r*1.15, bw = r*0.2 + lv*0.012*r;
    const g = cx.createLinearGradient(-bw,0,bw,0); g.addColorStop(0,`hsl(${h},40%,92%)`); g.addColorStop(0.5,`hsl(${h},${20+lv*7}%,72%)`); g.addColorStop(1,`hsl(${h},${30+lv*6}%,42%)`);
    cx.fillStyle = g; cx.beginPath(); cx.moveTo(-bw,r*0.25); cx.lineTo(-bw,-len*0.75); cx.lineTo(0,-len); cx.lineTo(bw,-len*0.75); cx.lineTo(bw,r*0.25); cx.closePath(); cx.fill();
    cx.lineWidth = r*0.07; cx.strokeStyle = 'rgba(20,10,5,.85)'; cx.stroke();
    cx.fillStyle = lv >= 5 ? '#ffd24a' : '#a87a3a'; cx.beginPath(); cx.roundRect(-r*0.55, r*0.22, r*1.1, r*0.2, r*0.08); cx.fill(); cx.stroke();
    cx.fillStyle = '#5a3418'; cx.beginPath(); cx.roundRect(-r*0.11, r*0.42, r*0.22, r*0.5, r*0.06); cx.fill(); cx.stroke();
    cx.fillStyle = `hsl(${h},100%,60%)`; cx.beginPath(); cx.arc(0, r*0.32, r*0.1, 0, Math.PI*2); cx.fill();
  } else if (t === 'arrow'){
    cx.rotate(-Math.PI/4);
    cx.strokeStyle = '#6a4220'; cx.lineWidth = r*0.13; cx.lineCap = 'round'; cx.beginPath(); cx.moveTo(0, r*0.95); cx.lineTo(0, -r*0.6); cx.stroke();
    cx.fillStyle = `hsl(${h},${30+lv*6}%,70%)`; cx.strokeStyle = 'rgba(20,10,5,.85)'; cx.lineWidth = r*0.07;
    cx.beginPath(); cx.moveTo(0,-r*1.05); cx.lineTo(r*0.3,-r*0.5); cx.lineTo(-r*0.3,-r*0.5); cx.closePath(); cx.fill(); cx.stroke();
    cx.fillStyle = `hsl(${h},90%,60%)`; for (const s of [-1,1]){ cx.beginPath(); cx.moveTo(0,r*0.55); cx.lineTo(s*r*0.35,r*0.75); cx.lineTo(s*r*0.32,r*1.0); cx.lineTo(0,r*0.85); cx.closePath(); cx.fill(); cx.stroke(); }
    if (lv >= 4) glow(0, -r*0.75, r*0.6, `hsla(${h},100%,70%,1)`, 0.6);
  } else if (t === 'egg'){
    if (lv <= 3){
      const g = cx.createRadialGradient(-r*0.25,-r*0.35,r*0.05,0,0,r); g.addColorStop(0,'#fffdf0'); g.addColorStop(0.5,`hsl(${h},60%,82%)`); g.addColorStop(1,`hsl(${h},50%,48%)`);
      cx.fillStyle = g; cx.beginPath(); cx.ellipse(0, r*0.05, r*0.66, r*0.85, 0, 0, Math.PI*2); cx.fill(); cx.lineWidth = r*0.08; cx.strokeStyle='rgba(20,10,5,.8)'; cx.stroke();
      cx.fillStyle = `hsl(${(h+150)%360},70%,55%)`; [[-0.25,-0.2,0.13],[0.22,0.15,0.16],[-0.1,0.45,0.1],[0.25,-0.45,0.09]].forEach(([a,b,c]) => { cx.beginPath(); cx.arc(a*r,b*r,c*r,0,Math.PI*2); cx.fill(); });

// ---------- 상태 ----------

function updShots(dt){

// ---------- 합성 ----------
function toast(t){ const e = document.getElementById('toast'); e.textContent = t; e.style.opacity = 1; clearTimeout(e._t); e._t = setTimeout(()=>e.style.opacity=0, 1300); }

}

  document.getElementById('bSum').classList.toggle('off', gold < sumCost); document.getElementById('bAtk').classList.toggle('off', gold < atkCost); }

function lp(e){ const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H }; }
function slotAt(p){ const c = Math.floor((p.x - GX)/CW), r = Math.floor((p.y - GY)/CH); if (c<0||c>=COLS||r<0||r>=ROWS) return -1; return r*COLS + c; }
cv.addEventListener('pointerdown', e => { const p = lp(e), i = slotAt(p);
  if (chest && Math.hypot(p.x - chest.x, p.y - (chest.y - 50)) < 90){ openChest(); return; }
  if (i >= 0 && grid[i]){ drag = { i, x:p.x, y:p.y }; cv.setPointerCapture(e.pointerId); } });

  document.getElementById('dotH').classList.toggle('on', T.some(canPiece));
  document.getElementById('dotC').classList.toggle('on', T.some(canCraft));
  const ns = tab + '|' + T.map(t => [own[t].have, own[t].star, own[t].pieces, equipped.indexOf(t), canCraft(t), craftItem(t) >= 0].join(',')).join(';');
  if (ns === sig) return; sig = ns;
  if (tab === 1){
    let h = '<div class="hd">장착한 영웅은 전장에 나와서 자기 물건의 피해를 올려줘요 · 장착 ' + equipped.length + ' / ' + MAX_EQ + '</div>';
    for (const t of T){ const o = own[t], eq = equipped.includes(t), need = piecesNeed(t);
      h += '<div class="row' + (eq ? ' eq' : '') + '"><img class="pic' + (o.have ? '' : ' no') + '" src="../proto2d/img/' + HIMG[t] + '.png">';
      h += '<div class="tx">' + TYPES[t].who + ' <span class="st">' + (o.have ? '★'.repeat(o.star) : '미보유') + '</span>';
      h += '<small>' + TYPES[t].name + ' 피해 ×' + (o.have ? (1.5 + 0.4*(o.star-1)).toFixed(1) : '1.5') + (eq ? ' (적용 중)' : '') + '<br><span style="color:' + (eq ? '#9dff9a' : '#b8a88a') + '">패시브 · ' + PASSIVE[t].name + ': ' + PASSIVE[t].desc(Math.max(1,o.star)) + '</span></small>';
      h += '<div class="bar"><b style="width:' + Math.min(100, o.pieces/need*100) + '%"></b></div><small>조각 ' + o.pieces + ' / ' + need + (o.star >= MAX_STAR ? ' · 최고 등급' : '') + '</small></div>';
      if (canPiece(t)) h += '<button data-a="piece" data-k="' + t + '">' + (o.have ? '★ 올리기' : '얻기') + '</button>';
      else if (o.have) h += '<button class="blue" data-a="eq" data-k="' + t + '">' + (eq ? '해제' : '장착') + '</button>';
      h += '</div>'; }
    document.getElementById('paneH').innerHTML = h;
  }
  if (tab === 2){
    let h = '<div class="hd">물건과 골드로 영웅을 만들어요 · 이미 있으면 ★이 올라가요</div>';
    for (const t of T){ const o = own[t], r = RECIPE[t], hasIt = craftItem(t) >= 0, hasG = gold >= r.gold;
      h += '<div class="row"><img class="pic' + (o.have ? '' : ' no') + '" src="../proto2d/img/' + HIMG[t] + '.png"><div class="tx">' + TYPES[t].who + (o.have ? ' <span class="st">' + '★'.repeat(o.star) + '</span>' : '');
      h += '<div class="need"><img src="' + itemIcon(t, r.lv) + '"><span class="' + (hasIt ? 'ok' : 'ng') + '">' + TYPES[t].name + ' ' + r.lv + '단계 이상</span> + <span class="' + (hasG ? 'ok' : 'ng') + '">💰' + r.gold.toLocaleString() + '</span></div></div>';
      h += '<button data-a="craft" data-k="' + t + '"' + (canCraft(t) ? '' : ' disabled') + '>' + (o.have ? '★ 올리기' : '제작') + '</button></div>'; }
    document.getElementById('paneC').innerHTML = h;
  }
}
document.getElementById('paneH').onclick = document.getElementById('paneC').onclick = e => {
  const b = e.target.closest('button'); if (!b) return; const t = b.dataset.k, a = b.dataset.a;
  if (a === 'eq'){ const i = equipped.indexOf(t); if (i >= 0) equipped.splice(i,1); else if (equipped.length >= MAX_EQ){ toast('장착은 ' + MAX_EQ + '명까지예요'); return; } else { equipped.push(t); toast(TYPES[t].who + ' 장착 · ' + PASSIVE[t].name + ' 발동!'); } sig = ''; updPanels(); }
  else if (a === 'piece'){ if (!canPiece(t)) return; own[t].pieces -= piecesNeed(t); gain(t); }
  else if (a === 'craft'){ if (!canCraft(t)) return; const i = craftItem(t); grid[i] = null; gold -= RECIPE[t].gold; goldShown = Math.min(goldShown, gold); updBtns(); gain(t); }
};
setInterval(updPanels, 400);
if (location.hash === '#test'){ gold = goldShown = 99999; for (const t in own){ own[t].have = true; own[t].star = 1; } equipped = ['orb','sword','egg']; }
load().then(() => { const l = document.getElementById('load'); l.style.opacity = 0; setTimeout(()=>l.remove(),400); updTop(); updBtns(); requestAnimationFrame(t=>{ last=t; frame(t); }); });
})();
</script>
</body>
</html>
